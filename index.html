<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sąskaitos faktūros</title>
<style>
  :root{
    --bench:#eceef2;--paper:#ffffff;--ink:#1b1e26;--ink2:#667085;
    --line:#e6e8ed;--line2:#d2d7df;--acc:#2f54eb;--acc-d:#1e3aa8;
    --good:#15803d;--good-bg:#e8f6ee;--bad:#dc2626;--bad-bg:#fdeaea;
    --warn:#b45309;--warn-bg:#fdf3e3;--chip:#eef1f6;
    --shadow:0 1px 2px rgba(20,24,33,.06),0 1px 1px rgba(20,24,33,.04);
    --shadow-l:0 10px 32px rgba(20,24,33,.14),0 2px 8px rgba(20,24,33,.08);
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);background:var(--bench);color:var(--ink);font-size:13px;line-height:1.45;-webkit-text-size-adjust:100%}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  a{color:var(--acc-d)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .hide{display:none !important}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:30;background:var(--ink);color:#e8ebf0;border-bottom:3px solid var(--acc)}
  .hwrap{max-width:1340px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:9px 16px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand .logo{font-family:var(--mono);font-weight:700;letter-spacing:.04em;background:var(--acc);color:#fff;padding:3px 8px;border-radius:4px;font-size:12px}
  .brand h1{font-size:15px;white-space:nowrap}
  .brand .sub{color:#9aa3b2;font-size:11px;font-family:var(--mono);white-space:nowrap}
  .hspace{flex:1}
  .hbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .hbtns button{font:inherit;cursor:pointer;border:1px solid #2c3340;background:#232a36;color:#e8ebf0;border-radius:6px;padding:5px 10px;font-size:12px}
  .hbtns button:hover{background:#353d4b}
  .hbtns button.go{background:var(--acc);border-color:var(--acc);font-weight:600}
  .hbtns button.go:hover{background:#4468f0}
  #cloudChip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px}
  #cloudChip.off{opacity:.55}
  #cloudChip.idle{border-color:#1f5c33;background:#16341f;color:#8ee0a6}
  #cloudChip.syncing{border-color:#2c4380;background:#1b2a52;color:#a8bcf5}
  #cloudChip.error,#cloudChip.conflict{border-color:#5c2020;background:#3a1618;color:#f5a3a3}
  #cloudChip.offline{border-color:#5c4a20;background:#3a2f16;color:#f0cf8e}
  .cloud-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
  .dot.idle{background:var(--good)}.dot.syncing{background:var(--acc)}
  .dot.error,.dot.conflict{background:var(--bad)}.dot.offline{background:var(--warn)}
  .lang{display:inline-flex;border:1px solid #2c3340;border-radius:6px;overflow:hidden}
  .lang button{border:0;border-radius:0;padding:5px 9px}
  .lang button.on{background:var(--acc);color:#fff;font-weight:650}

  /* ---------- tabs ---------- */
  nav.tabs{position:sticky;top:51px;z-index:25;background:var(--paper);border-bottom:1px solid var(--line)}
  .twrap{max-width:1340px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
  .twrap::-webkit-scrollbar{display:none}
  nav.tabs button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--ink2);padding:11px 14px;border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:550}
  nav.tabs button .ic{font-family:var(--mono);color:var(--line2);margin-right:6px}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
  nav.tabs button.on .ic{color:var(--acc)}
  nav.tabs button .badge{margin-left:6px;background:var(--bad);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;font-family:var(--mono);font-weight:700}

  main{max-width:1340px;margin:0 auto;padding:18px 16px 90px}
  .panel{display:none}.panel.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  /* ---------- cards ---------- */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin-bottom:16px}
  .card>.head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card>.head h2{font-size:14px}
  .card>.body{padding:14px}
  .card>.body.tight{padding:0}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-d);font-weight:600}
  .sect-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700;margin:0 0 9px}

  /* ---------- buttons ---------- */
  .btn{font:inherit;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:7px;padding:7px 12px;font-weight:550;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{border-color:var(--acc);color:var(--acc-d)}
  .btn.primary{background:var(--acc);border-color:var(--acc-d);color:#fff}
  .btn.primary:hover{background:var(--acc-d);color:#fff}
  .btn.good{background:var(--good);border-color:#12692f;color:#fff}
  .btn.good:hover{background:#12692f;color:#fff}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
  .btn.lg{padding:11px 18px;font-size:14px;border-radius:9px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .icon-btn{cursor:pointer;border:0;background:transparent;color:var(--ink2);font-family:var(--mono);font-size:14px;padding:2px 7px;border-radius:5px;line-height:1.4}
  .icon-btn:hover{background:var(--chip);color:var(--bad)}
  .icon-btn.mv:hover{color:var(--acc-d)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* ---------- forms ---------- */
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
  label.f span.l{font-weight:550;color:var(--ink)}
  label.f span.h{font-size:11px;color:var(--ink2)}
  input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:6px;padding:6px 8px;width:100%}
  textarea{resize:vertical;min-height:64px;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:2px solid #b9c5f5;border-color:var(--acc)}
  input[type=number]{font-family:var(--mono);text-align:right}
  input[type=checkbox]{width:auto}
  input:disabled{background:#f6f7f9;color:var(--ink2)}
  .inline-check{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
  @media(max-width:980px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}}

  /* ---------- tables ---------- */
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
  table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--paper)}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{position:sticky;top:0;background:#eef1f5;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-weight:650;z-index:1}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover{background:#f3f5f9}
  td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  td input,td select{padding:4px 6px;border-radius:5px}
  td input[type=number]{min-width:64px}
  tfoot td{font-weight:650;background:#eef1f5;border-top:2px solid var(--line2)}
  .empty{padding:34px 18px;text-align:center;color:var(--ink2)}
  .empty .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:5px}

  /* ---------- chips / pills ---------- */
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:20px;background:var(--chip);color:var(--ink2);white-space:nowrap}
  .pill.draft{background:var(--chip);color:var(--ink2)}
  .pill.sent{background:#e8eeff;color:var(--acc-d)}
  .pill.paid{background:var(--good-bg);color:var(--good)}
  .pill.part{background:var(--warn-bg);color:var(--warn)}
  .pill.over{background:var(--bad-bg);color:var(--bad)}
  .muted{color:var(--ink2)}.right{text-align:right}.grow{flex:1}
  .note{font-size:11.5px;color:var(--ink2);background:#eef3ff;border:1px solid #cdd9f5;border-radius:8px;padding:9px 11px}
  .note b{color:var(--acc-d)}
  .note.warn{background:var(--warn-bg);border-color:#f0dcb8}
  .note.warn b{color:var(--warn)}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
  .kpi .kl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700}
  .kpi .kv{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:5px;letter-spacing:-.02em}
  .kpi .ks{font-size:11.5px;color:var(--ink2);margin-top:2px}
  .kpi.alert{border-color:#f3c7c7;background:#fffafa}
  .kpi.alert .kv{color:var(--bad)}
  .kpi.ok .kv{color:var(--good)}

  /* ---------- combo / autocomplete ---------- */
  .combo{position:relative}
  .combo .menu{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow-l);max-height:330px;overflow-y:auto;display:none}
  .combo .menu.on{display:block}
  .combo .opt{padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--line)}
  .combo .opt:last-child{border-bottom:0}
  .combo .opt:hover,.combo .opt.hi{background:#eef3ff}
  .combo .opt .t{font-weight:600;font-size:12.5px}
  .combo .opt .s{font-size:11px;color:var(--ink2);margin-top:1px;font-family:var(--mono)}
  .combo .opt .tag{float:right;font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);background:var(--chip);border-radius:20px;padding:1px 7px;margin-left:8px}
  .combo .opt .tag.reg{background:#e8eeff;color:var(--acc-d)}
  .combo .opt .tag.bad{background:var(--bad-bg);color:var(--bad)}
  .combo .head-opt{padding:6px 11px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);background:#f6f7fa;font-weight:700;border-bottom:1px solid var(--line)}

  /* ---------- editor ---------- */
  .ed-top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
  @media(max-width:900px){.ed-top{grid-template-columns:minmax(0,1fr)}}
  .party{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fbfcfe}
  .party .pn{font-weight:650;font-size:13.5px}
  .party .pd{color:var(--ink2);font-size:12px;line-height:1.65;margin-top:3px;white-space:pre-wrap}
  .totals-box{margin-left:auto;width:min(360px,100%)}
  .totals-box .tr{display:flex;justify-content:space-between;gap:14px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
  .totals-box .tr .tl{color:var(--ink2)}
  .totals-box .tr .tv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
  .totals-box .grand{margin-top:9px;background:var(--ink);color:#fff;border-radius:10px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .totals-box .grand .tl{color:#c9d4ff;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .totals-box .grand .tv{font-size:20px;font-weight:750;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .actionbar{position:sticky;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);margin:0 -16px -90px;padding:11px 16px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;box-shadow:0 -2px 14px rgba(20,24,33,.06)}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(16,20,28,.42);z-index:90;display:none;align-items:center;justify-content:center;padding:18px}
  .scrim.on{display:flex}
  .modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-l);width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
  .modal.wide{width:min(980px,100%)}
  .modal .mh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .modal .mh h2{font-size:15px}
  .modal .mb{padding:16px;overflow-y:auto;flex:1}
  .modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;background:#fbfcfe}

  /* ---------- branding ---------- */
  .brand-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px}
  @media(max-width:900px){.brand-grid{grid-template-columns:minmax(0,1fr)}}
  .preview-wrap{position:sticky;top:110px;align-self:start}
  #brandPreview{width:100%;height:640px;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
  @media(max-width:900px){#brandPreview{height:460px}.preview-wrap{position:static}}
  .swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .sw.on{border-color:var(--ink);transform:scale(1.06)}
  .swatches input[type=color]{width:34px;height:26px;padding:1px;border-radius:7px;cursor:pointer}
  .brand-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}
  @media(max-width:560px){.brand-toggles{grid-template-columns:minmax(0,1fr)}}

  /* ---------- progress ---------- */
  .prog{height:7px;background:var(--chip);border-radius:20px;overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .18s ease}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;box-shadow:var(--shadow-l);opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:min(560px,92vw);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--bad)}

  @media(max-width:640px){
    /* header must stay ONE row: wrapping buttons used to land on top of the
       brand. Backup/Restore are dropped here because Settings > Data has both. */
    .hwrap{gap:8px;padding:8px 11px;flex-wrap:nowrap}
    .brand{flex:1;min-width:0}
    .brand>div{min-width:0}
    .brand h1{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .brand .sub{display:none}
    .hbtns{flex-wrap:nowrap;gap:4px;flex:none}
    #btnExport,#btnImport{display:none}
    #cloudChip{padding:6px 8px}
    #cloudChip .cl{display:none}
    #btnNewTop{padding:6px 10px;font-size:14px;font-weight:700}
    #btnNewTop span{display:none}
    .lang button{padding:5px 7px;font-size:11px}
    main{padding:14px 11px 90px}
    /* one swipeable row instead of three stacked rows of buttons */
    .actionbar{margin:0 -11px -90px;padding:10px 11px;flex-wrap:nowrap;overflow-x:auto;
               scrollbar-width:none;gap:7px}
    .actionbar::-webkit-scrollbar{display:none}
    .actionbar .grow{display:none}
    .actionbar .btn{flex:none}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .kpi .kv{font-size:19px}
    .card>.head{gap:8px}
    /* invoice lines stack into one card per line - a phone cannot usefully
       scroll a 8-column table sideways while typing into it */
    #linesTbl,#linesTbl tbody,#wbTbl,#wbTbl tbody,#wbTbl tfoot{display:block}
    #linesTbl thead,#wbTbl thead{display:none}
    #linesTbl tr,#wbTbl tbody tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;
      border:1px solid var(--line);border-radius:10px;padding:11px;margin:0 0 10px;background:#fff}
    #linesTbl td,#wbTbl td{display:block;border:0;padding:0;white-space:normal;width:auto!important;min-width:0}
    #linesTbl td::before,#wbTbl td::before{content:attr(data-lab);display:block;font-size:9.5px;
      text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700;margin-bottom:3px}
    #linesTbl td[data-c=name]{grid-column:1/-1}
    #linesTbl td[data-c=sum]{grid-column:1/4;text-align:right;align-self:end;font-size:15px;font-weight:700}
    #linesTbl td[data-c=del]{grid-column:4;text-align:right;align-self:end}
    #linesTbl td[data-c=del]::before,#wbTbl td[data-c=del]::before{content:'';margin:0}
    #wbTbl tbody tr{align-items:end}
    #wbTbl td[data-c=name]{grid-column:1/4}
    #wbTbl td[data-c=del]{grid-column:4;text-align:right;align-self:end}
    #wbTbl td[data-c=code]{grid-column:1/3}
    #wbTbl tfoot tr{display:flex;justify-content:space-between;gap:10px;padding:9px 11px}
    #wbTbl tfoot td{display:inline-block;border:0}
    #wbTbl tfoot td[colspan]{font-weight:700}
    #linesTbl td input,#wbTbl td input{width:100%}
    #linesTbl td input[type=number],#wbTbl td input[type=number]{min-width:0}
    .card>.body.tight .tblwrap{padding:11px 11px 1px}
    .modal{max-height:92vh;width:100%}
    .modal .mf{flex-direction:column-reverse}
    .modal .mf .btn{width:100%;justify-content:center}
  }
  @media print{header,nav.tabs,.actionbar,.hbtns{display:none}}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">
      <span class="logo">SF</span>
      <div><h1 id="brandTitle">Sąskaitos faktūros</h1><div class="sub" id="brandSub">invoicing · 2026</div></div>
    </div>
    <div class="hspace"></div>
    <div class="hbtns">
      <button id="btnNewTop" class="go">＋ <span data-i18n="newInvoice">Nauja sąskaita</span></button>
      <button id="btnExport" data-i18n="backup">Atsarginė kopija</button>
      <button id="btnImport" data-i18n="restore">Atkurti</button>
      <button id="cloudChip" title="">☁</button>
      <span class="lang"><button id="lang-lt">LT</button><button id="lang-en">EN</button></span>
    </div>
  </div>
</header>

<nav class="tabs"><div class="twrap" id="tabbar"></div></nav>

<main>
  <section class="panel" id="p-dash"></section>
  <section class="panel" id="p-invoices"></section>
  <section class="panel" id="p-editor"></section>
  <section class="panel" id="p-waybills"></section>
  <section class="panel" id="p-waybill"></section>
  <section class="panel" id="p-customers"></section>
  <section class="panel" id="p-items"></section>
  <section class="panel" id="p-settings"></section>
</main>

<div class="scrim" id="scrim"><div class="modal" id="modal">
  <div class="mh"><h2 id="modalTitle"></h2><div class="hspace" style="flex:1"></div><button class="icon-btn" id="modalX">✕</button></div>
  <div class="mb" id="modalBody"></div>
  <div class="mf" id="modalFoot"></div>
</div></div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
/* =========================================================================
   Sąskaitos faktūros — single-file invoicing app.
   Same shell conventions as the other CraftOS apps (offer / shopflow):
   sticky dark header, sticky tab strip, cards, localStorage state, LT/EN.
   ========================================================================= */

/* ===================== i18n ===================== */
const I18N={
 lt:{
  appTitle:"Sąskaitos faktūros",appSub:"sąskaitų išrašymas · 2026",
  newInvoice:"Nauja sąskaita",backup:"Atsarginė kopija",restore:"Atkurti",

<script>
/* ===================== state ===================== */
const KEY='inv_state_v1', LANG_KEY='fab_lang'; /* same lang key the sibling apps use */

const STATE_V=3;
/* Everything about how the printed invoice LOOKS lives here, so the document
   can be restyled without touching printInvoice's structure. */
function blankBrand(){
  return {
    template:"modern",        /* modern | classic | minimal */
    accent:"#2f54eb",
    font:"sans",              /* sans | serif | mono */
    logoH:66,
    showLogo:true, showBank:true, showWords:true, showSign:true,
    showNotes:true, showFooter:true, showUnit:true, showVatCol:true, showLineNo:true,
    paidStamp:true,
    stamp:"",                 /* signature / company stamp image, data URL */
    headline:"",              /* free line under the seller name */

}
function blankState(){
  return {
    v:STATE_V,
    seller:{name:"",code:"",vat:"",address:"",email:"",phone:"",web:"",director:"",logo:"",
            banks:[{bank:"",iban:"",swift:""}]},
    settings:{series:"SF",next:1,format:"{S}-{YYYY}-{NNNN}",vatRate:21,vatPayer:true,
              currency:"EUR",term:14,unit:"vnt",note:"",footer:"",
              showDisc:false,

              wbPlace:"",wbNote:""},
    brand:blankBrand(),
    customers:[],items:[],invoices:[],
    waybills:[],

}
/* v1 kept showWords / showSign under settings; v2 moved them into brand.
   v3 added važtaraščiai (consignment notes) with their own numbering. */
function migrate(p){
  if(!p)return p;
  if(p.v<2){
    p.brand=Object.assign(blankBrand(),p.brand||{});
    if(p.settings){
      if(p.settings.showWords!==undefined)p.brand.showWords=!!p.settings.showWords;
      if(p.settings.showSign!==undefined)p.brand.showSign=!!p.settings.showSign;
      delete p.settings.showWords;delete p.settings.showSign;
    }
    p.v=2;
  }
  if(p.v<3){
    p.waybills=p.waybills||[];
    p.fleet=p.fleet||[];
    p.drivers=p.drivers||[];
    p.v=3;
  }
  return p;
}
let S=blankState();
let VIEW='dash';            /* active tab */
let EDIT=null;              /* invoice object currently open in the editor */
let saveTimer=null;

function load(){
  try{
    const raw=localStorage.getItem(KEY);

}
/* Single funnel for every source of a state document: localStorage, an
   imported backup and a cloud pull all land here, so defaults and the v1->v2
   migration are applied exactly once. */
function adopt(p){
  p=migrate(p||{});
  const d=blankState();                 /* defaults must be read before the
                                           top-level merge overwrites them */
  S=Object.assign({},d,p);
  S.seller=Object.assign({},d.seller,p.seller||{});
  S.settings=Object.assign({},d.settings,p.settings||{});
  S.brand=Object.assign({},blankBrand(),p.brand||{});

  if(!Array.isArray(S.seller.banks)||!S.seller.banks.length)S.seller.banks=[{bank:"",iban:"",swift:""}];
  S.customers=p.customers||[];S.items=p.items||[];S.invoices=p.invoices||[];
  S.waybills=p.waybills||[];S.fleet=p.fleet||[];S.drivers=p.drivers||[];
  S.v=STATE_V;
  return S;
}
function saveNow(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('localStorage full — export a backup and remove the logo image',true);}

}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250);}

/* =========================================================================
   Cloud sync — optional, Supabase over plain REST (no SDK, no CDN).

   The whole state is ONE jsonb document per workspace, the same shape the
   shopflow app syncs. Unlike the offer app this signs IN first: invoices carry
   customer and financial data, so the table is locked to `authenticated` and
   the publishable key on its own grants nothing.

   Conflicts: push does a pull-first check of updated_at. If the row moved
   under us we do not silently overwrite — the user picks a side.
   ========================================================================= */
const Cloud={
  CFG:'inv_cloud',
  cfg:null, status:'off',   /* off | idle | syncing | error | conflict | offline */
  msg:'', seen:null, timer:null, poll:null, dirty:false, busy:false,

  load(){try{this.cfg=JSON.parse(localStorage.getItem(this.CFG)||'null');}catch(e){this.cfg=null;}
         if(this.cfg)this.status='idle';return this.cfg;},
  save(c){this.cfg=c;try{localStorage.setItem(this.CFG,JSON.stringify(c));}catch(e){}},
  on(){return !!(this.cfg&&this.cfg.url&&this.cfg.key&&this.cfg.workspace&&this.cfg.refresh);},
  base(){return String(this.cfg.url||'').replace(/\/+$/,'');},

  /* ---- auth ---- */
  async signIn(url,key,email,password,workspace){
    url=String(url||'').replace(/\/+$/,'');
    const r=await fetch(url+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},
      body:JSON.stringify({email,password})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error_description||j.msg||j.error||('HTTP '+r.status));
    this.save({url,key,email,workspace:workspace||'default',
               token:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000});
    this.status='idle';this.msg='';
    return true;
  },
  async token(){
    if(!this.cfg)throw new Error('not configured');
    if(this.cfg.token&&Date.now()<this.cfg.exp-60000)return this.cfg.token;
    const r=await fetch(this.base()+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':this.cfg.key,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:this.cfg.refresh})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error_description||j.msg||('HTTP '+r.status));
    this.cfg.token=j.access_token;this.cfg.refresh=j.refresh_token||this.cfg.refresh;
    this.cfg.exp=Date.now()+(j.expires_in||3600)*1000;
    this.save(this.cfg);
    return this.cfg.token;
  },
  signOut(){
    this.cfg=null;this.status='off';this.msg='';this.seen=null;this.dirty=false;
    clearTimeout(this.timer);clearInterval(this.poll);this.poll=null;
    try{localStorage.removeItem(this.CFG);}catch(e){}
    paintCloud();
  },

  async rest(path,opts){
    const tok=await this.token();
    const o=Object.assign({},opts||{});
    o.headers=Object.assign({'apikey':this.cfg.key,'Authorization':'Bearer '+tok,
                             'Content-Type':'application/json'},o.headers||{});
    const r=await fetch(this.base()+'/rest/v1/'+path,o);
    if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,180));
    const txt=await r.text();
    return txt?JSON.parse(txt):null;
  },
  row(){return 'invoice_workspaces?id=eq.'+encodeURIComponent(this.cfg.workspace);},

  async fetchRemote(){
    const rows=await this.rest(this.row()+'&select=id,data,updated_at,updated_by');
    return (rows&&rows[0])||null;
  },
  /* Adopt whatever the cloud holds, discarding local state. */
  async pull(){
    const row=await this.fetchRemote();
    if(!row)return null;
    adopt(row.data||{});
    this.seen=row.updated_at;this.dirty=false;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    return row;
  },
  /* Overwrite the cloud with local state. */
  async put(){
    const now=new Date().toISOString();
    await this.rest('invoice_workspaces',{
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify({id:this.cfg.workspace,data:S,updated_at:now,
                           updated_by:(this.cfg.email||'').split('@')[0]||'device'})
    }).then(rows=>{this.seen=(rows&&rows[0]&&rows[0].updated_at)||now;});
    this.dirty=false;
  },

  /* Debounced auto-push, called from saveNow(). */
  mark(){
    if(!this.on())return;
    this.dirty=true;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>this.sync(),1800);
    paintCloud();
  },
  async sync(force){
    if(!this.on()||this.busy)return;
    this.busy=true;this.status='syncing';this.msg='';paintCloud();
    try{
      const row=await this.fetchRemote();
      if(row&&this.seen&&row.updated_at!==this.seen&&this.dirty&&!force){
        /* both sides moved since our last sync — never pick silently */
        this.status='conflict';this.remote=row;this.busy=false;paintCloud();
        conflictModal(row);
        return;
      }
      if(row&&(!this.seen||row.updated_at!==this.seen)&&!this.dirty){
        adopt(row.data||{});this.seen=row.updated_at;
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
        render();
      }else{
        await this.put();
      }
      this.status='idle';
    }catch(e){
      this.status=navigator.onLine===false?'offline':'error';
      this.msg=String(e.message||e);
    }
    this.busy=false;paintCloud();
  },
  start(){
    if(!this.on())return;
    this.sync();
    clearInterval(this.poll);
    /* no realtime without the SDK, so look for other devices once a minute */
    this.poll=setInterval(()=>{if(!this.dirty)this.sync();},60000);
  }
};

/* ===================== tiny helpers ===================== */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;

function toast(msg,bad){
  const el=$('#toast');el.textContent=msg;el.classList.toggle('bad',!!bad);el.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2600);
}
function money(n){
  return new Intl.NumberFormat(LANG==='lt'?'lt-LT':'en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}).format(r2(n||0));
}
function cur(){return S.settings.currency||'EUR';}
function eurStr(n){return money(n)+' '+cur();}
const today=()=>new Date().toISOString().slice(0,10);
/* Dates are handled in UTC end to end: a local-midnight Date sent through
   toISOString() rolls back a day in every UTC+ zone, Vilnius included. */
function addDays(iso,d){const x=new Date(iso+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+(d|0));return x.toISOString().slice(0,10);}
function fmtDate(iso){
  if(!iso)return '';
  return LANG==='lt'?iso:new Date(iso+'T00:00:00Z').toLocaleDateString('en-GB',{timeZone:'UTC'});
}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);}

/* Lithuanian diacritics -> ASCII, length preserving, for search + file names. */
const DIA={'ą':'a','č':'c','ę':'e','ė':'e','į':'i','š':'s','ų':'u','ū':'u','ž':'z'};
const deacc=s=>s.replace(/[ąčęėįšųūž]/g,c=>DIA[c]);
const normQ=s=>deacc(String(s||'').toLowerCase());
function slug(s){return deacc(String(s||'').toLowerCase()).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'file';}

/* ===================== amount in words ===================== */
const LT_ONES=['','vienas','du','trys','keturi','penki','šeši','septyni','aštuoni','devyni','dešimt',
  'vienuolika','dvylika','trylika','keturiolika','penkiolika','šešiolika','septyniolika','aštuoniolika','devyniolika'];
const LT_TENS=['','','dvidešimt','trisdešimt','keturiasdešimt','penkiasdešimt','šešiasdešimt','septyniasdešimt','aštuoniasdešimt','devyniasdešimt'];
/* forms = [singular, plural, genitive] — Lithuanian picks by the last one/two digits */
function ltForm(n,forms){
  const t2=n%100,u=n%10;
  if(t2>=11&&t2<=19)return forms[2];
  if(u===1)return forms[0];
  if(u===0)return forms[2];
  return forms[1];
}
function lt3(n){
  const out=[],h=Math.floor(n/100),r=n%100;
  if(h)out.push(h===1?'šimtas':LT_ONES[h]+' šimtai');
  if(r<20){if(r)out.push(LT_ONES[r]);}
  else{out.push(LT_TENS[Math.floor(r/10)]);if(r%10)out.push(LT_ONES[r%10]);}
  return out.join(' ');
}
function ltNum(n){
  n=Math.floor(Math.abs(n));
  if(n===0)return 'nulis';
  const groups=[[1e9,['milijardas','milijardai','milijardų']],
                [1e6,['milijonas','milijonai','milijonų']],
                [1e3,['tūkstantis','tūkstančiai','tūkstančių']]];
  const parts=[];let rest=n;
  for(const [div,forms] of groups){
    const q=Math.floor(rest/div);
    if(q){parts.push((q===1?'':lt3(q)+' ')+ltForm(q,forms));rest%=div;}
  }
  if(rest)parts.push(lt3(rest));
  return parts.join(' ');
}
const EN_ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve',
  'thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const EN_TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function en3(n){
  const out=[],h=Math.floor(n/100),r=n%100;
  if(h)out.push(EN_ONES[h]+' hundred');
  if(r){
    if(out.length)out.push('and');
    if(r<20)out.push(EN_ONES[r]);
    else{out.push(EN_TENS[Math.floor(r/10)]+(r%10?'-'+EN_ONES[r%10]:''));}
  }
  return out.join(' ');
}
function enNum(n){
  n=Math.floor(Math.abs(n));
  if(n===0)return 'zero';
  const groups=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand']],parts=[];
  let rest=n;
  for(const [div,word] of groups){
    const q=Math.floor(rest/div);
    if(q){parts.push(en3(q)+' '+word);rest%=div;}
  }
  if(rest)parts.push(en3(rest));
  return parts.join(' ');
}
/* "Vienas tūkstantis du šimtai eurų 50 ct" */
function amountWords(v){
  const whole=Math.floor(r2(v)),cents=Math.round((r2(v)-whole)*100);
  const cc=String(cents).padStart(2,'0');
  if(LANG==='lt'){
    const w=ltNum(whole);
    return w.charAt(0).toUpperCase()+w.slice(1)+' '+ltForm(whole,['euras','eurai','eurų'])+' '+cc+' ct';
  }
  const w=enNum(whole);
  return w.charAt(0).toUpperCase()+w.slice(1)+' '+(whole===1?'euro':'euros')+' '+cc+' cents';
}

/* ===================== invoice maths ===================== */
/* One place computes every total. Line: qty * price, minus discount %, then VAT. */
function lineNet(l){return r2(num(l.qty)*num(l.price)*(1-num(l.disc)/100));}
function lineGross(l){return r2(l.qty*0+lineNet(l)*(1+num(l.vat)/100));}
function calc(inv){
  const lines=inv.lines||[];
  let gross=0,net=0,disc=0;
  const byVat={};
  lines.forEach(l=>{
    const raw=r2(num(l.qty)*num(l.price));
    const n=lineNet(l);
    gross+=raw;disc+=raw-n;net+=n;
    const rate=num(l.vat);
    byVat[rate]=(byVat[rate]||0)+n;
  });
  net=r2(net);disc=r2(disc);gross=r2(gross);
  let vat=0;
  const vatRows=Object.keys(byVat).map(Number).sort((a,b)=>a-b).map(rate=>{
    const base=r2(byVat[rate]),amt=r2(base*rate/100);
    vat+=amt;return {rate,base,amt};
  });
  vat=r2(vat);
  const total=r2(net+vat);
  const paid=r2((inv.payments||[]).reduce((s,p)=>s+num(p.amount),0));
  return {gross,disc,net,vat,vatRows,total,paid,due:r2(total-paid)};
}
function invStatus(inv){
  const c=calc(inv);
  if(inv.status==='draft')return 'draft';
  if(c.due<=0.005&&c.total>0)return 'paid';
  if(c.paid>0.005)return 'part';
  if(inv.dueDate&&inv.dueDate<today())return 'over';
  return 'sent';
}
const STATUS_LABEL={draft:'stDraft',sent:'stSent',paid:'stPaid',part:'stPart',over:'stOver'};

/* ===================== numbering ===================== */
function formatNo(fmt,series,n){
  const d=new Date();
  return String(fmt||'{S}-{YYYY}-{NNNN}')
    .replace(/\{S\}/g,series||'')
    .replace(/\{YYYY\}/g,String(d.getFullYear()))
    .replace(/\{YY\}/g,String(d.getFullYear()).slice(2))
    .replace(/\{MM\}/g,String(d.getMonth()+1).padStart(2,'0'))
    .replace(/\{NNNNN\}/g,String(n).padStart(5,'0'))
    .replace(/\{NNNN\}/g,String(n).padStart(4,'0'))
    .replace(/\{NNN\}/g,String(n).padStart(3,'0'))
    .replace(/\{N\}/g,String(n));
}
function makeNumber(seq){
  const s=S.settings;
  return formatNo(s.format,s.series,seq==null?s.next:seq);
}

<script>
/* =========================================================================
   Lithuanian company registry — offline search over 230k+ legal entities.

   data/lt-registry.txt.gz is one company per line:
       code \t name \t address \t vat \t form \t status
   It is fetched once (~6.4 MB), kept in the Cache API so it also works
   offline, inflated with DecompressionStream and then searched as raw text:
   we keep a diacritic-folded copy of the whole blob plus newline offsets for
   both copies, so a match position maps straight back to its line without
   ever building 230k JS objects.
   ========================================================================= */
const REG={
  url:'data/lt-registry.txt.gz',
  state:'idle',          /* idle | loading | ready | error */
  text:'', norm:'', offT:null, offN:null, lines:0, meta:null,
  _p:null,

  cacheName:'inv-registry-v1',

  async cached(){
    if(!('caches' in window))return null;
    try{const c=await caches.open(this.cacheName);return await c.match(this.url);}catch(e){return null;}
  },
  /* Load only if it is already downloaded — called on boot so a returning
     user gets instant, offline search without a surprise 6 MB fetch. */
  async loadIfCached(){
    const hit=await this.cached();
    if(hit)return this.load();
    return false;
  },
  load(onProgress){
    if(this.state==='ready')return Promise.resolve(true);
    if(this._p)return this._p;
    this.state='loading';
    this._p=(async()=>{
      try{
        let res=await this.cached();
        if(!res){
          res=await fetch(this.url);
          if(!res.ok)throw new Error('HTTP '+res.status);
          if('caches' in window){
            try{const c=await caches.open(this.cacheName);await c.put(this.url,res.clone());}catch(e){}
          }
        }
        const total=Number(res.headers.get('content-length'))||6500000;
        let buf;
        if(res.body&&onProgress){
          const reader=res.body.getReader();const chunks=[];let got=0;
          for(;;){
            const {done,value}=await reader.read();
            if(done)break;
            chunks.push(value);got+=value.length;
            onProgress(Math.min(.92,got/total));
          }
          buf=new Blob(chunks);
        }else{
          buf=await res.blob();
        }
        onProgress&&onProgress(.94);
        let text;
        if(typeof DecompressionStream==='function'){
          const ds=new DecompressionStream('gzip');
          text=await new Response(buf.stream().pipeThrough(ds)).text();
        }else{
          throw new Error('DecompressionStream unsupported');
        }
        onProgress&&onProgress(.98);
        this.text=text;
        this.norm=deacc(text.toLowerCase());
        this.offT=this._offsets(this.text);
        this.offN=this._offsets(this.norm);
        this.lines=this.offT.length-1;
        this.state='ready';
        try{
          const m=await fetch('data/lt-registry.json');
          if(m.ok)this.meta=await m.json();
        }catch(e){}
        onProgress&&onProgress(1);
        return true;
      }catch(e){
        console.warn('registry load failed',e);
        this.state='error';this._p=null;
        return false;
      }
    })();
    return this._p;
  },
  _offsets(s){
    /* start index of every line, plus a sentinel one past the end */
    const out=[0];
    for(let i=s.indexOf('\n');i>=0;i=s.indexOf('\n',i+1))out.push(i+1);
    out.push(s.length+1);
    return Int32Array.from(out);
  },
  _lineAt(off,pos){
    let lo=0,hi=off.length-2;
    while(lo<hi){const mid=(lo+hi+1)>>1;if(off[mid]<=pos)lo=mid;else hi=mid-1;}
    return lo;
  },
  row(i){
    const a=this.offT[i],b=this.offT[i+1]-1;
    const p=this.text.slice(a,Math.min(b,this.text.length)).split('\t');
    return {code:p[0]||'',name:p[1]||'',address:p[2]||'',vat:p[3]||'',form:p[4]||'',status:p[5]||''};
  },

  /* Ranked substring search. Scans the folded blob with indexOf, collects at
     most SCAN hits, scores them and returns the best `limit`. */
  search(q,limit){
    limit=limit||25;
    if(this.state!=='ready')return [];
    const nq=normQ(q).trim();
    if(nq.length<3)return [];
    const isCode=/^\d{5,}$/.test(nq);
    const SCAN=600;
    const seen=new Set(),hits=[];
    let pos=0;
    while(hits.length<SCAN){
      const i=this.norm.indexOf(nq,pos);
      if(i<0)break;
      pos=i+nq.length;
      const ln=this._lineAt(this.offN,i);
      if(seen.has(ln))continue;
      seen.add(ln);
      hits.push({ln,at:i-this.offN[ln]});
    }
    const out=hits.map(h=>{
      const r=this.row(h.ln);
      const nameStart=r.code.length+1;
      const nameEnd=nameStart+r.name.length;
      let score;
      if(h.at===0)score=isCode&&r.code===nq?100:70;          /* company code */
      else if(h.at===nameStart)score=60;                      /* name starts with */
      else if(h.at<nameEnd)score=40-Math.min(20,h.at-nameStart)/2;  /* inside name */
      else score=10;                                          /* address only */
      if(r.status)score-=15;
      if(r.vat)score+=2;
      score-=Math.min(8,r.name.length/40);                    /* prefer tighter names */
      return {...r,score};
    });
    out.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'lt'));
    return out.slice(0,limit);
  }
};

/* Map a registry row onto the customer shape the app stores. */
function customerFromRegistry(r){
  return {id:uid(),kind:'company',name:r.name,code:r.code,vat:r.vat,address:r.address,
          email:'',phone:'',contact:'',term:null,note:r.status?t('regFlagged')+' '+r.status:'',
          src:'registry',form:r.form};
}
</script>

  <div class="kpis">
    <div class="kpi"><div class="kl">${esc(t('kpiUnpaid'))}</div><div class="kv">${money(unpaid)}</div>
      <div class="ks">${esc(t('kpiUnpaidSub'))} ${unpaidN}</div></div>
    <div class="kpi ${overN?'alert':''}"><div class="kl">${esc(t('kpiOverdue'))}</div><div class="kv">${money(over)}</div>
      <div class="ks">${overN?esc(t('kpiOverdueSub'))+' '+Math.round(lateDays/overN):esc(t('dashNoOverdue'))}</div></div>
    <div class="kpi ok"><div class="kl">${esc(t('kpiMonth'))}</div><div class="kv">${money(moTot)}</div>
      <div class="ks">${esc(t('kpiMonthSub'))} ${money(moNet)}</div></div>
    <div class="kpi"><div class="kl">${esc(t('kpiVat'))}</div><div class="kv">${money(moVat)}</div>
      <div class="ks">${esc(t('kpiVatSub'))}</div></div>
  </div>
  ${toDeliver?`<div class="card"><div class="body" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
     <div class="grow"><div class="eyebrow">⛟ ${esc(t('kpiToDeliver'))}</div>
       <div class="muted" style="margin-top:4px">${toDeliver} ${esc(t('kpiToDeliverSub'))}</div></div>
     <button class="btn" id="dashWb">${esc(t('tabWaybills'))} →</button>
   </div></div>`:''}

  <div class="card"><div class="body" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <button class="btn primary lg" id="dashNew">＋ ${esc(t('newInvoice'))}</button>
    <div class="muted grow">${esc(t('dashStartSub'))}</div>
  </div></div>

  <div class="card">
    <div class="head"><h2>${esc(t('dashYear'))} ${year}</h2><div class="grow"></div>
      <span class="pill mono">${money(yearTotal)} ${esc(cur())}</span></div>
    <div class="body">
      <div style="display:flex;align-items:flex-end;gap:5px;height:118px">
        ${months.map((v,m)=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px" title="${money(v)}">
          <div style="width:100%;background:${v?'var(--acc)':'var(--line)'};height:${Math.max(2,Math.round(v/maxM*92))}px;border-radius:4px 4px 0 0"></div>
          <div class="mono" style="font-size:9.5px;color:var(--ink2)">${String(m+1).padStart(2,'0')}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="head"><h2>${esc(t('dashOverdue'))}</h2></div>
    ${overdue.length?`<div class="body tight"><div class="tblwrap" style="border:0">${invTable(overdue,true)}</div></div>`

  const sb=$('#dashSetupBtn');if(sb)sb.onclick=()=>go('settings');
  $('#dashNew').onclick=newInvoice;
  $('#dashAll').onclick=()=>go('invoices');
  const dw=$('#dashWb');if(dw)dw.onclick=()=>go('waybills');

function renderInvoices(){

  if(invFilter.q){

    list=list.filter(i=>normQ([i.no,(i.buyer&&i.buyer.name)||'',(i.buyer&&i.buyer.code)||'',
      money(calc(i).total),i.notes||''].join(' ')).includes(q));
  }
  const tot=list.reduce((s,i)=>s+calc(i).total,0);

    <input id="invQ" placeholder="${esc(t('invSearch'))}" value="${esc(invFilter.q)}" style="max-width:320px">
    <div class="btnrow">${FIL.map(([k,l])=>`<button class="btn sm ${invFilter.status===k?'primary':''}" data-fs="${k}">${esc(t(l))}</button>`).join('')}</div>
    <select id="invYear" style="width:auto"><option value="all">${esc(t('allYears'))}</option>

    <div class="grow"></div>

  </div>
  ${list.length?`<div class="body tight"><div class="tblwrap" style="border:0">${invTable(list,false)}</div></div>`
    :`<div class="empty"><div class="big">${esc(t('noInvoices'))}</div>${esc(t('noInvoicesSub'))}</div>`}
  </div>`;

  const q=$('#invQ');
  q.oninput=()=>{invFilter.q=q.value;renderInvoices();$('#invQ').focus();
    $('#invQ').setSelectionRange(q.value.length,q.value.length);};
  $$('#p-invoices [data-fs]').forEach(b=>b.onclick=()=>{invFilter.status=b.dataset.fs;renderInvoices();});
  $('#invYear').onchange=e=>{invFilter.year=e.target.value;renderInvoices();};

/* ===================== invoice create / open ===================== */
function newInvoice(){
  if(!S.seller.name)toast(t('needSellerName'));
  const s=S.settings;
  EDIT={
    id:uid(),seq:s.next,no:makeNumber(s.next),
    type:s.vatPayer?'invoice':'simple',
    date:today(),dueDate:addDays(today(),s.term|0),term:s.term|0,
    buyer:null,customerId:null,
    lines:[blankLine()],
    notes:s.note||'',currency:s.currency||'EUR',
    status:'draft',payments:[],
    issuer:S.seller.director||'',receiver:'',
    createdAt:new Date().toISOString(),isNew:true
  };
  go('editor');
}
function blankLine(){
  return {id:uid(),name:'',qty:1,unit:S.settings.unit||'vnt',price:0,disc:0,
          vat:S.settings.vatPayer?num(S.settings.vatRate):0};
}
function openInvoice(id){
  const inv=S.invoices.find(x=>x.id===id);
  if(!inv)return;
  EDIT=JSON.parse(JSON.stringify(inv));
  EDIT.isNew=false;
  go('editor');
}
function commitInvoice(){
  if(!EDIT)return false;
  if(!EDIT.buyer||!EDIT.buyer.name){toast(t('edNoBuyer'),true);return false;}
  if(!(EDIT.lines||[]).some(l=>String(l.name||'').trim()||num(l.price))){toast(t('edNoLines'),true);return false;}
  const copy=JSON.parse(JSON.stringify(EDIT));
  delete copy.isNew;
  const ix=S.invoices.findIndex(x=>x.id===copy.id);
  if(ix>=0)S.invoices[ix]=copy;
  else{
    S.invoices.push(copy);
    if(copy.seq>=S.settings.next)S.settings.next=copy.seq+1;
    /* count catalogue usage once, when the invoice is first stored - doing it
       on every save would inflate the popularity sort on the items tab */
    (copy.lines||[]).forEach(l=>{
      if(!l.itemId)return;
      const it=S.items.find(x=>x.id===l.itemId);
      if(it)it.used=(it.used||0)+1;
    });
  }
  EDIT.isNew=false;
  saveNow();
  return true;
}
</script>
