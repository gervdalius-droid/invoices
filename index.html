function bindEditorTop(){
  $('#edBack').onclick=()=>{EDIT=null;go('invoices');};
  $('#edType').onchange=e=>{
    EDIT.type=e.target.value;
    if(EDIT.type==='simple')EDIT.lines.forEach(l=>l.vat=0);
    renderLines();refreshTotals();
  };
  $('#edNo').oninput=e=>{EDIT.no=e.target.value;};
  $('#edDate').onchange=e=>{
    EDIT.date=e.target.value||today();
    EDIT.dueDate=addDays(EDIT.date,EDIT.term|0);
    $('#edDue').value=EDIT.dueDate;
  };
  $('#edDue').onchange=e=>{
    EDIT.dueDate=e.target.value;
    if(EDIT.date&&EDIT.dueDate)EDIT.term=daysBetween(EDIT.date,EDIT.dueDate);
  };
  $('#edNotes').oninput=e=>{EDIT.notes=e.target.value;};
  $('#edIssuer').oninput=e=>{EDIT.issuer=e.target.value;};
  $('#edReceiver').oninput=e=>{EDIT.receiver=e.target.value;};
  $('#edSellerEdit').onclick=()=>go('settings');
  $('#edAddLine').onclick=()=>{EDIT.lines.push(blankLine());renderLines();refreshTotals();
    const rows=$$('#linesBody input[data-k="name"]');rows[rows.length-1]&&rows[rows.length-1].focus();};
  const fc=$('#edFromCat');if(fc)fc.onclick=pickFromCatalogue;

  $('#edSave').onclick=()=>{if(commitInvoice()){toast(t('saved'));render();}};
  $('#edPdf').onclick=()=>{if(commitInvoice())printInvoice(EDIT);};
  $('#edMail').onclick=()=>{if(commitInvoice())mailInvoice(EDIT);};
  $('#edXml').onclick=()=>{if(commitInvoice())exportUbl(EDIT);};
  $('#edWb').onclick=()=>{
    if(!commitInvoice())return;
    const existing=S.waybills.find(w=>w.invoiceId===EDIT.id);
    if(existing){openWaybill(existing.id);return;}
    newWaybill(EDIT);
  };
  const p=$('#edPay');if(p)p.onclick=()=>paymentsModal(EDIT);
  const pd=$('#edPaid');if(pd)pd.onclick=()=>{
    const c=calc(EDIT);
    if(c.due<=0.005){toast(t('stPaid'));return;}
    EDIT.payments=EDIT.payments||[];
    EDIT.payments.push({id:uid(),date:today(),amount:c.due,note:''});
    if(EDIT.status==='draft')EDIT.status='sent';
    commitInvoice();refreshTotals();renderEditor();toast(t('saved'));
  };
  const cp=$('#edCopy');if(cp)cp.onclick=duplicateInvoice;
  const dl=$('#edDel');if(dl)dl.onclick=()=>confirmBox(EDIT.no||'',()=>{
    S.invoices=S.invoices.filter(x=>x.id!==EDIT.id);
    EDIT=null;saveNow();toast(t('deleted'));go('invoices');
  });
}

function renderLines(){
  const showD=S.settings.showDisc;
  /* data-c / data-lab drive the stacked card layout on phones (see CSS) */
  $('#linesBody').innerHTML=(EDIT.lines||[]).map((l,i)=>`
    <tr data-i="${i}">
      <td data-c="name" data-lab="${esc(t('lnName'))}"><input data-k="name" value="${esc(l.name||'')}" list="itemNames" placeholder="${esc(t('lnName'))}"></td>
      <td data-c="qty" data-lab="${esc(t('lnQty'))}"><input data-k="qty" type="number" step="any" value="${l.qty}"></td>
      <td data-c="unit" data-lab="${esc(t('lnUnit'))}"><input data-k="unit" value="${esc(l.unit||'')}"></td>
      <td data-c="price" data-lab="${esc(t('lnPrice'))}"><input data-k="price" type="number" step="any" value="${l.price}"></td>
      ${showD?`<td data-c="disc" data-lab="${esc(t('lnDisc'))}"><input data-k="disc" type="number" step="any" value="${l.disc||0}"></td>`:''}
      <td data-c="vat" data-lab="${esc(t('lnVat'))}"><input data-k="vat" type="number" step="any" value="${l.vat||0}"></td>
      <td class="num" data-c="sum" data-lab="${esc(t('lnSum'))}" data-sum>${money(lineNet(l))}</td>
      <td data-c="del"><button class="icon-btn" data-del title="${esc(t('del'))}">✕</button></td>
    </tr>`).join('')
    +`<datalist id="itemNames">${S.items.map(it=>`<option value="${esc(it.name)}">`).join('')}</datalist>`;

  $$('#linesBody tr').forEach(tr=>{
    const i=+tr.dataset.i;
    tr.querySelectorAll('input').forEach(inp=>{
      inp.oninput=()=>{
        const k=inp.dataset.k;
        EDIT.lines[i][k]=(k==='name'||k==='unit')?inp.value:num(inp.value);
        if(k==='name'){
          /* typing a catalogue name fills unit / price / VAT once */
          const it=S.items.find(x=>x.name===inp.value);
          if(it){
            const row=EDIT.lines[i];
            row.unit=it.unit||row.unit;row.price=num(it.price);
            row.vat=EDIT.type==='simple'?0:num(it.vat);row.itemId=it.id;
            tr.querySelector('[data-k="unit"]').value=row.unit;
            tr.querySelector('[data-k="price"]').value=row.price;
            tr.querySelector('[data-k="vat"]').value=row.vat;
          }
        }
        tr.querySelector('[data-sum]').textContent=money(lineNet(EDIT.lines[i]));
        refreshTotals();
      };
      inp.onkeydown=e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          if(i===EDIT.lines.length-1){EDIT.lines.push(blankLine());renderLines();refreshTotals();
            const rows=$$('#linesBody input[data-k="name"]');rows[rows.length-1].focus();}
          else $$('#linesBody tr')[i+1].querySelector('[data-k="name"]').focus();
        }
      };
    });
    tr.querySelector('[data-del]').onclick=()=>{
      EDIT.lines.splice(i,1);
      if(!EDIT.lines.length)EDIT.lines.push(blankLine());
      renderLines();refreshTotals();
    };
  });
}

function refreshTotals(){
  const c=calc(EDIT),showD=S.settings.showDisc;
  $('#edTotals').innerHTML=`
    ${showD&&c.disc?`<div class="tr"><div class="tl">${esc(t('edDiscount'))}</div><div class="tv">−${money(c.disc)}</div></div>`:''}
    <div class="tr"><div class="tl">${esc(t('edSubtotal'))}</div><div class="tv">${money(c.net)}</div></div>
    ${c.vatRows.filter(v=>v.rate>0).map(v=>`<div class="tr"><div class="tl">${esc(t('edVat'))} ${v.rate}% <span class="muted">(${money(v.base)})</span></div><div class="tv">${money(v.amt)}</div></div>`).join('')}
    <div class="grand"><div class="tl">${esc(t('edTotal'))}</div><div class="tv">${money(c.total)}</div></div>
    ${c.paid?`<div class="tr" style="margin-top:9px"><div class="tl">${esc(t('pdfPaid'))}</div><div class="tv">${money(c.paid)}</div></div>
      <div class="tr"><div class="tl"><b>${esc(t('edDueNow'))}</b></div><div class="tv">${money(c.due)}</div></div>`:''}
    <div class="muted" style="margin-top:9px;font-size:11.5px">${esc(amountWords(c.total))}</div>`;
}

function duplicateInvoice(){
  const s=S.settings;
  const copy=JSON.parse(JSON.stringify(EDIT));
  copy.id=uid();copy.seq=s.next;copy.no=makeNumber(s.next);
  copy.date=today();copy.dueDate=addDays(today(),copy.term|0);
  copy.status='draft';copy.payments=[];copy.isNew=true;
  copy.lines=(copy.lines||[]).map(l=>({...l,id:uid()}));
  EDIT=copy;renderEditor();toast(t('copied'));
}

function pickFromCatalogue(){
  const list=S.items.slice().sort((a,b)=>(b.used||0)-(a.used||0)||a.name.localeCompare(b.name,'lt'));
  openModal(t('edAddFromCat'),
    `<div class="tblwrap"><table><thead><tr><th>${esc(t('itemName'))}</th><th>${esc(t('itemUnit'))}</th>
      <th class="num">${esc(t('itemPrice'))}</th><th class="num">${esc(t('itemVat'))}</th></tr></thead><tbody>
      ${list.map(it=>`<tr class="clickable" data-it="${it.id}"><td>${esc(it.name)}</td><td>${esc(it.unit||'')}</td>
        <td class="num">${money(it.price)}</td><td class="num">${num(it.vat)}%</td></tr>`).join('')}
    </tbody></table></div>`,
    `<button class="btn" data-mclose>${esc(t('close'))}</button>`,
    ()=>{$$('#modalBody [data-it]').forEach(tr=>tr.onclick=()=>{
      const it=S.items.find(x=>x.id===tr.dataset.it);
      const last=EDIT.lines[EDIT.lines.length-1];
      const row={id:uid(),name:it.name,qty:1,unit:it.unit||S.settings.unit,price:num(it.price),
                 disc:0,vat:EDIT.type==='simple'?0:num(it.vat),itemId:it.id};
      if(last&&!String(last.name||'').trim()&&!num(last.price))EDIT.lines[EDIT.lines.length-1]=row;
      else EDIT.lines.push(row);
      closeModal();renderLines();refreshTotals();
    });});
}

/* ===================== payments ===================== */
function paymentsModal(inv){
  const draw=()=>{
    const c=calc(inv);
    $('#modalBody').innerHTML=`
      <div class="grid3" style="align-items:end">
        <label class="f"><span class="l">${esc(t('payDate'))}</span><input type="date" id="pDate" value="${today()}"></label>
        <label class="f"><span class="l">${esc(t('payAmount'))}</span><input type="number" step="any" id="pAmt" value="${c.due>0?c.due:''}"></label>
        <label class="f"><span class="l">${esc(t('payNote'))}</span><input id="pNote"></label>
      </div>
      <div class="btnrow" style="margin:12px 0"><button class="btn primary sm" id="pAdd">${esc(t('payAdd'))}</button>
        <span class="muted">${esc(t('payRest'))} <b class="mono">${money(c.due)}</b></span></div>
      ${(inv.payments||[]).length?`<div class="tblwrap"><table><thead><tr><th>${esc(t('payDate'))}</th>
        <th class="num">${esc(t('payAmount'))}</th><th>${esc(t('payNote'))}</th><th></th></tr></thead><tbody>
        ${inv.payments.map(p=>`<tr><td class="mono">${esc(fmtDate(p.date))}</td><td class="num">${money(p.amount)}</td>
          <td>${esc(p.note||'')}</td><td><button class="icon-btn" data-pd="${p.id}">✕</button></td></tr>`).join('')}
        </tbody></table></div>`:`<div class="empty">${esc(t('payNone'))}</div>`}`;
    $('#pAdd').onclick=()=>{
      const a=num($('#pAmt').value);
      if(!a){toast(t('payAmount'),true);return;}
      inv.payments=inv.payments||[];
      inv.payments.push({id:uid(),date:$('#pDate').value||today(),amount:a,note:$('#pNote').value});
      if(inv.status==='draft')inv.status='sent';
      commitInvoice();draw();refreshTotals();
    };
    $$('#modalBody [data-pd]').forEach(b=>b.onclick=()=>{
      inv.payments=inv.payments.filter(p=>p.id!==b.dataset.pd);
      commitInvoice();draw();refreshTotals();
    });
  };
  openModal(t('payTitle'),'',`<button class="btn primary" data-mclose>${esc(t('close'))}</button>`,()=>{
    draw();
    $('#modalFoot').querySelectorAll('[data-mclose]').forEach(b=>b.onclick=()=>{closeModal();renderEditor();});
  });
}
</script>

<script>
/* =========================================================================
   Buyer picker — ONE box that searches saved customers first and the whole
   Lithuanian company registry underneath, so a new buyer normally costs one
   keystroke sequence and one click, with no separate "add customer" step.
   ========================================================================= */
function bindBuyerBox(){
  const q=$('#buyerQ');
  if(q){
    attachBuyerCombo(q,$('#buyerMenu'));
    $('#buyerManual').onclick=()=>customerModal(null,c=>setBuyer(c));
    $('#buyerRegistry').onclick=()=>registryModal(r=>{
      const c=customerFromRegistry(r);S.customers.push(c);saveNow();setBuyer(c);
    });
  }else{
    $('#buyerChange').onclick=()=>{EDIT.buyer=null;EDIT.customerId=null;
      $('#buyerBox').innerHTML=buyerCardHtml();bindBuyerBox();$('#buyerQ').focus();};
    $('#buyerEdit').onclick=()=>{
      const saved=S.customers.find(c=>c.id===EDIT.customerId);
      customerModal(saved||EDIT.buyer,c=>setBuyer(c));
    };
  }
}
function setBuyer(c){
  EDIT.customerId=c.id||null;
  EDIT.buyer={name:c.name,code:c.code||'',vat:c.vat||'',address:c.address||'',
              email:c.email||'',phone:c.phone||'',contact:c.contact||'',note:c.note||'',
              kind:c.kind||'company'};
  if(c.term!=null&&c.term!==''){EDIT.term=num(c.term);EDIT.dueDate=addDays(EDIT.date,EDIT.term);}
  const due=$('#edDue');if(due)due.value=EDIT.dueDate;
  $('#buyerBox').innerHTML=buyerCardHtml();
  bindBuyerBox();
}

function attachBuyerCombo(input,menu){
  let hi=-1,opts=[],timer=null;
  const closeM=()=>{menu.classList.remove('on');hi=-1;};
  const draw=()=>{
    const q=input.value.trim();
    const nq=normQ(q);
    opts=[];
    let html='';
    if(nq.length>=1){
      const saved=S.customers.filter(c=>normQ(c.name+' '+(c.code||'')+' '+(c.address||'')).includes(nq)).slice(0,6);
      if(saved.length){
        html+=`<div class="head-opt">${esc(t('savedCustomers'))}</div>`;
        saved.forEach(c=>{
          opts.push({kind:'cust',c});
          html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">${esc(c.name)}</div>
            <div class="s">${esc([c.code,c.vat,(c.address||'').split(',')[0]].filter(Boolean).join(' · '))}</div></div>`;
        });
      }
    }
    if(nq.length>=3){
      if(REG.state==='ready'){
        const hits=REG.search(q,14);
        if(hits.length){
          html+=`<div class="head-opt">${esc(t('registryResults'))}</div>`;
          hits.forEach(r=>{
            opts.push({kind:'reg',r});
            const tag=r.status?`<span class="tag bad">${esc(r.status)}</span>`
                    :(r.vat?'<span class="tag reg">PVM</span>':'');
            html+=`<div class="opt" data-i="${opts.length-1}">${tag}<div class="t">${esc(r.name)}</div>
              <div class="s">${esc([r.code,r.vat,r.address].filter(Boolean).join(' · '))}</div></div>`;
          });
        }else if(!opts.length){
          html+=`<div class="opt muted">${esc(t('regNoRes'))}</div>`;
        }
      }else if(REG.state==='loading'){
        html+=`<div class="opt muted">${esc(t('regLoading'))}</div>`;
      }else{
        opts.push({kind:'load'});
        html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">⤓ ${esc(t('regLoad'))}</div>
          <div class="s">${esc(t('regTitle'))} · 6.4 MB · ${esc(t('regSize'))}</div></div>`;
      }
    }else if(nq.length&&!opts.length){
      html+=`<div class="opt muted">${esc(t('regTypeMore'))}</div>`;
    }
    if(!html){closeM();return;}
    menu.innerHTML=html;
    menu.classList.add('on');
    menu.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  };
  const pick=i=>{
    const o=opts[i];if(!o)return;
    if(o.kind==='load'){
      closeM();
      loadRegistryWithProgress().then(ok=>{if(ok){draw();input.focus();}});
      return;
    }
    if(o.kind==='cust'){closeM();setBuyer(o.c);return;}
    const c=customerFromRegistry(o.r);
    S.customers.push(c);saveNow();
    closeM();setBuyer(c);
  };
  input.oninput=()=>{clearTimeout(timer);timer=setTimeout(draw,140);};
  input.onfocus=()=>{if(REG.state==='idle')REG.loadIfCached().then(ok=>{if(ok&&input.value.trim().length>=3)draw();});draw();};
  input.onkeydown=e=>{
    const cells=Array.from(menu.querySelectorAll('[data-i]'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!cells.length)return;
      hi=Math.max(0,Math.min(cells.length-1,hi+(e.key==='ArrowDown'?1:-1)));
      cells.forEach((c,n)=>c.classList.toggle('hi',n===hi));
      cells[hi].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(hi>=0&&cells[hi])pick(+cells[hi].dataset.i);
      else if(cells.length===1)pick(+cells[0].dataset.i);
    }else if(e.key==='Escape')closeM();
  };
  /* re-rendering the buyer box detaches this menu; the listener drops itself
     rather than piling up one dead handler per "Keisti" click */
  const onDocClick=ev=>{
    if(!menu.isConnected){document.removeEventListener('click',onDocClick,true);return;}
    if(!menu.parentElement.contains(ev.target))closeM();
  };
  document.addEventListener('click',onDocClick,true);
}

/* Full-screen registry browser (also reachable from the customers tab). */
function registryModal(onPick){
  openModal(t('regTitle'),
    `<div class="note" style="margin-bottom:12px">${esc(t('regHint'))}</div>
     <input id="regQ" placeholder="${esc(t('regPh'))}" autocomplete="off">
     <div id="regStatus" style="margin-top:10px"></div>
     <div id="regList" style="margin-top:10px"></div>`,
    `<button class="btn" data-mclose>${esc(t('close'))}</button>`,
    ()=>{
      const status=$('#regStatus'),list=$('#regList'),q=$('#regQ');
      const paint=()=>{
        if(REG.state==='ready'){
          const m=REG.meta;
          status.innerHTML=`<span class="pill">✓ ${esc(t('regLoaded'))}${m?` · ${m.companies.toLocaleString('lt-LT')} ${esc(t('regCompanies'))} · ${m.withVat.toLocaleString('lt-LT')} ${esc(t('regWithVat'))}`:''}</span>`;
        }else if(REG.state==='loading'){
          status.innerHTML=`<div class="muted">${esc(t('regLoading'))}</div><div class="prog"><i id="regBar"></i></div>`;
        }else if(REG.state==='error'){
          status.innerHTML=`<div class="note warn">${esc(t('regUnavail'))}</div>`;
        }else{
          status.innerHTML=`<button class="btn primary sm" id="regLoadBtn">⤓ ${esc(t('regLoad'))} (6.4 MB)</button>`;
          $('#regLoadBtn').onclick=()=>{loadRegistryWithProgress(p=>{
            const bar=$('#regBar');if(bar)bar.style.width=Math.round(p*100)+'%';
            if(!bar)paint();
          }).then(()=>{paint();search();});paint();};
        }
      };
      const search=()=>{
        const v=q.value.trim();
        if(REG.state!=='ready'){list.innerHTML='';return;}
        if(normQ(v).length<3){list.innerHTML=`<div class="empty">${esc(t('regTypeMore'))}</div>`;return;}
        const hits=REG.search(v,40);
        list.innerHTML=hits.length?`<div class="tblwrap"><table><thead><tr>
            <th>${esc(t('custName'))}</th><th>${esc(t('custCode'))}</th><th>${esc(t('custVat'))}</th>
            <th>${esc(t('custAddr'))}</th></tr></thead><tbody>
            ${hits.map(r=>`<tr class="clickable" data-code="${esc(r.code)}">
              <td>${esc(r.name)}${r.status?` <span class="pill over">${esc(r.status)}</span>`:''}</td>
              <td class="mono">${esc(r.code)}</td><td class="mono">${esc(r.vat||'—')}</td>
              <td class="muted">${esc(r.address)}</td></tr>`).join('')}
          </tbody></table></div>`:`<div class="empty">${esc(t('regNoRes'))}</div>`;
        list.querySelectorAll('[data-code]').forEach(tr=>tr.onclick=()=>{
          const r=hits.find(x=>x.code===tr.dataset.code);
          closeModal();onPick(r);
        });
      };
      let tm=null;
      q.oninput=()=>{clearTimeout(tm);tm=setTimeout(search,140);};
      paint();
      if(REG.state==='idle')REG.loadIfCached().then(ok=>{paint();if(ok)search();});
      q.focus();
    });
}
function loadRegistryWithProgress(onP){
  const ok=REG.load(onP||(()=>{}));
  return ok.then(done=>{
    if(!done)toast(t('regUnavail'),true);
    return done;
  });
}
</script>

<script>
/* =========================================================================
   Važtaraštis — the Lithuanian consignment note that travels with the goods.

   Three parties (siuntėjas / vežėjas / gavėjas), a route, the vehicle and
   driver, the cargo itself and three signature lines. Everything the Kelių
   transporto kodeksas 29 str. and the vidaus vežimo taisyklės ask for.

   The fast path is "make one from an invoice": the seller becomes the
   consignor, the buyer the consignee and the invoice lines become cargo.
   ========================================================================= */
let WB=null;                       /* waybill open in the editor */
let wbFilter={q:'',open:false};

function blankWbLine(){
  return {id:uid(),name:'',code:'',unit:S.settings.unit||'vnt',qty:1,packs:1,weight:0,value:0};
}
function newWaybill(from){
  const s=S.settings;
  WB={
    id:uid(),seq:s.wbNext,no:makeWbNumber(s.wbNext),
    date:today(),place:s.wbPlace||'',
    invoiceId:null,
    consignor:partyOf(S.seller),
    consignee:null,
    carrier:partyOf(S.seller),carrierSelf:true,
    loadAddr:S.seller.address||'',loadDate:today(),
    unloadAddr:'',unloadDate:'',
    vehicle:'',trailer:'',driver:S.seller.director||'',driverDoc:'',
    lines:[blankWbLine()],
    notes:s.wbNote||'',
    status:'draft',deliveredAt:'',receivedBy:'',
    isNew:true
  };
  if(from)fillWbFromInvoice(WB,from);
  go('waybill');
}
function partyOf(o){
  return {name:o.name||'',code:o.code||'',vat:o.vat||'',address:o.address||'',
          phone:o.phone||'',email:o.email||'',contact:o.contact||''};
}
/* Invoice -> waybill. Quantities carry over; weight is left to the user
   because an invoice never knows it. */
function fillWbFromInvoice(wb,inv){
  wb.invoiceId=inv.id;
  wb.consignee=Object.assign(partyOf(inv.buyer||{}),{});
  wb.unloadAddr=(inv.buyer&&inv.buyer.address)||'';
  wb.notes=[wb.notes,inv.no?(LANG==='lt'?'Pagal sąskaitą ':'Per invoice ')+inv.no:''].filter(Boolean).join('\n');
  const lines=(inv.lines||[]).filter(l=>String(l.name||'').trim());
  if(lines.length)wb.lines=lines.map(l=>({
    id:uid(),name:l.name,code:'',unit:l.unit||S.settings.unit||'vnt',
    qty:num(l.qty),packs:0,weight:0,value:r2(lineNet(l))}));
  return wb;
}
function openWaybill(id){
  const w=S.waybills.find(x=>x.id===id);
  if(!w)return;
  WB=JSON.parse(JSON.stringify(w));WB.isNew=false;
  go('waybill');
}
function wbTotals(w){
  const L=w.lines||[];
  return {packs:L.reduce((s,l)=>s+num(l.packs),0),
          weight:r2(L.reduce((s,l)=>s+num(l.weight),0)),
          value:r2(L.reduce((s,l)=>s+num(l.value),0)),
          qty:r2(L.reduce((s,l)=>s+num(l.qty),0))};
}
function wbStatus(w){return w.status==='delivered'?'delivered':(w.status==='draft'?'draft':'issued');}
const WB_STATUS_LABEL={draft:'wbStatusDraft',issued:'wbStatusIssued',delivered:'wbStatusDelivered'};
const WB_STATUS_PILL={draft:'draft',issued:'sent',delivered:'paid'};

function commitWaybill(){
  if(!WB)return false;
  if(!WB.consignee||!WB.consignee.name){toast(t('wbNoConsignee'),true);return false;}
  if(!(WB.lines||[]).some(l=>String(l.name||'').trim())){toast(t('wbNoLines'),true);return false;}
  const copy=JSON.parse(JSON.stringify(WB));
  delete copy.isNew;
  const ix=S.waybills.findIndex(x=>x.id===copy.id);
  if(ix>=0)S.waybills[ix]=copy;
  else{
    S.waybills.push(copy);
    if(copy.seq>=S.settings.wbNext)S.settings.wbNext=copy.seq+1;
  }
  WB.isNew=false;
  saveNow();
  return true;
}

/* ---------- list ---------- */
function renderWaybills(){
  let list=S.waybills.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.seq||0)-(a.seq||0));
  if(wbFilter.open)list=list.filter(w=>wbStatus(w)!=='delivered');
  if(wbFilter.q){
    const q=normQ(wbFilter.q);
    list=list.filter(w=>normQ([w.no,(w.consignee&&w.consignee.name)||'',w.vehicle,w.driver,
      w.unloadAddr,w.loadAddr].join(' ')).includes(q));
  }
  $('#p-waybills').innerHTML=`
  <div class="card"><div class="head">
    <input id="wbQ" placeholder="${esc(t('wbSearch'))}" value="${esc(wbFilter.q)}" style="max-width:320px">
    <div class="btnrow">
      <button class="btn sm ${wbFilter.open?'':'primary'}" data-wf="all">${esc(t('wbAll'))}</button>
      <button class="btn sm ${wbFilter.open?'primary':''}" data-wf="open">${esc(t('wbOpen'))}</button>
    </div>
    <div class="grow"></div>
    <span class="pill mono">${list.length}</span>
    <button class="btn sm primary" id="wbNewBtn">＋ ${esc(t('wbNew'))}</button>
  </div>
  ${list.length?`<div class="body tight"><div class="tblwrap" style="border:0"><table><thead><tr>
      <th>${esc(t('colWbNo'))}</th><th>${esc(t('colDate'))}</th><th>${esc(t('wbConsignee'))}</th>
      <th>${esc(t('colRoute'))}</th><th>${esc(t('colVehicle'))}</th>
      <th class="num">${esc(t('colPacks'))}</th><th class="num">${esc(t('colWeight'))}</th>
      <th>${esc(t('colStatus'))}</th></tr></thead><tbody>
      ${list.map(w=>{const tt=wbTotals(w),st=wbStatus(w);
        const route=[(w.loadAddr||'').split(',')[0],(w.unloadAddr||'').split(',')[0]].filter(Boolean).join(' → ');
        return `<tr class="clickable" data-wb="${w.id}">
          <td class="mono"><b>${esc(w.no||'—')}</b></td>
          <td class="mono">${esc(fmtDate(w.date))}</td>
          <td>${esc((w.consignee&&w.consignee.name)||'—')}</td>
          <td class="muted">${esc(route||'—')}</td>
          <td class="mono">${esc(w.vehicle||'—')}</td>
          <td class="num">${tt.packs||'—'}</td>
          <td class="num">${tt.weight?money(tt.weight):'—'}</td>
          <td><span class="pill ${WB_STATUS_PILL[st]}">${esc(t(WB_STATUS_LABEL[st]))}</span></td></tr>`;}).join('')}
    </tbody></table></div></div>`
    :`<div class="empty"><div class="big">${esc(t('wbNone'))}</div>${esc(t('wbNoneSub'))}</div>`}
  </div>`;
  const q=$('#wbQ');
  q.oninput=()=>{wbFilter.q=q.value;renderWaybills();const e=$('#wbQ');e.focus();e.setSelectionRange(e.value.length,e.value.length);};
  $$('#p-waybills [data-wf]').forEach(b=>b.onclick=()=>{wbFilter.open=b.dataset.wf==='open';renderWaybills();});
  $('#wbNewBtn').onclick=()=>newWaybill();
  $$('#p-waybills [data-wb]').forEach(tr=>tr.onclick=()=>openWaybill(tr.dataset.wb));
}

/* ---------- editor ---------- */
function wbPartyCard(which){
  const key={consignor:'wbConsignor',carrier:'wbCarrier',consignee:'wbConsignee'}[which];
  const p=WB[which];
  if(which==='consignee'&&!p)return `<div class="party" style="background:#fff;border-style:dashed">
    <div class="sect-title">${esc(t(key))}</div>
    <div class="combo"><input id="wbConsQ" placeholder="${esc(t('wbPickConsignee'))}" autocomplete="off">
      <div class="menu" id="wbConsMenu"></div></div>
    <div class="btnrow" style="margin-top:9px">
      <button class="btn sm" id="wbConsManual">${esc(t('useManual'))}</button>
      <button class="btn sm" id="wbConsReg">${esc(t('regFind'))}</button>
    </div></div>`;
  return `<div class="party">
    <div class="sect-title">${esc(t(key))}</div>
    <div class="pn">${esc((p&&p.name)||'—')}</div>
    <div class="pd">${[p&&p.code?t('pdfCode')+' '+p.code:'',(p&&p.address)||'',(p&&p.phone)||'']
      .filter(Boolean).map(esc).join('<br>')}</div>
    <div class="btnrow" style="margin-top:9px">
      <button class="btn sm" data-wbedit="${which}">${esc(t('edChange'))}</button>
      ${which==='carrier'?`<label class="inline-check" style="margin-left:4px">
        <input type="checkbox" id="wbSelf" ${WB.carrierSelf?'checked':''}> <span>${esc(t('wbCarrierSelf'))}</span></label>`:''}
    </div></div>`;
}

function renderWaybill(){
  if(!WB){go('waybills');return;}
  const inv=WB.invoiceId?S.invoices.find(i=>i.id===WB.invoiceId):null;
  const st=wbStatus(WB);
  $('#p-waybill').innerHTML=`
  <div class="btnrow" style="margin-bottom:12px">
    <button class="btn sm" id="wbBack">${esc(t('wbBack'))}</button>
    <div class="grow"></div>
    ${inv?`<button class="btn sm" id="wbGoInv">${esc(t('wbInvoice'))}: <b class="mono">${esc(inv.no)}</b></button>`
        :`<span class="muted">${esc(t('wbInvoice'))}: ${esc(t('wbNoInvoice'))}</span>`}
    ${WB.isNew?'':`<span class="pill ${WB_STATUS_PILL[st]}">${esc(t(WB_STATUS_LABEL[st]))}</span>`}
  </div>

  <div class="card"><div class="body">
    <div class="grid4">
      <label class="f"><span class="l">${esc(t('wbNo'))}</span>
        <input id="wbNo" value="${esc(WB.no||'')}" class="mono"></label>
      <label class="f"><span class="l">${esc(t('wbDate'))}</span>
        <input type="date" id="wbDate" value="${esc(WB.date||'')}"></label>
      <label class="f" style="grid-column:span 2"><span class="l">${esc(t('wbPlace'))}</span>
        <input id="wbPlace" value="${esc(WB.place||'')}"></label>
    </div>
  </div></div>

  <div class="grid3" style="margin-bottom:16px" id="wbParties">
    <div id="wbBoxConsignor">${wbPartyCard('consignor')}</div>
    <div id="wbBoxCarrier">${wbPartyCard('carrier')}</div>
    <div id="wbBoxConsignee">${wbPartyCard('consignee')}</div>
  </div>

  <div class="card">
    <div class="head"><h2>${esc(t('wbRoute'))}</h2></div>
    <div class="body">
      <div class="grid4">
        <label class="f" style="grid-column:span 2"><span class="l">${esc(t('wbLoadAddr'))}</span>
          <input id="wbLoadAddr" value="${esc(WB.loadAddr||'')}"></label>
        <label class="f"><span class="l">${esc(t('wbLoadDate'))}</span>
          <input type="date" id="wbLoadDate" value="${esc(WB.loadDate||'')}"></label>
        <div></div>
        <label class="f" style="grid-column:span 2"><span class="l">${esc(t('wbUnloadAddr'))}</span>
          <input id="wbUnloadAddr" value="${esc(WB.unloadAddr||'')}"></label>
        <label class="f"><span class="l">${esc(t('wbUnloadDate'))}</span>
          <input type="date" id="wbUnloadDate" value="${esc(WB.unloadDate||'')}"></label>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="head"><h2>${esc(t('wbTransport'))}</h2><div class="grow"></div>
      ${S.fleet.length?`<select id="wbFleetPick" style="width:auto"><option value="">${esc(t('wbPick'))}…</option>
        ${S.fleet.map(f=>`<option value="${f.id}">${esc([f.plate,f.make].filter(Boolean).join(' · '))}</option>`).join('')}</select>`:''}
      ${S.drivers.length?`<select id="wbDriverPick" style="width:auto"><option value="">${esc(t('wbDriver'))}…</option>
        ${S.drivers.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select>`:''}
    </div>
    <div class="body"><div class="grid4">
      <label class="f"><span class="l">${esc(t('wbVehicle'))}</span><input id="wbVehicle" value="${esc(WB.vehicle||'')}"></label>
      <label class="f"><span class="l">${esc(t('wbTrailer'))}</span><input id="wbTrailer" value="${esc(WB.trailer||'')}"></label>
      <label class="f"><span class="l">${esc(t('wbDriver'))}</span><input id="wbDriver" value="${esc(WB.driver||'')}"></label>
      <label class="f"><span class="l">${esc(t('wbDriverDoc'))}</span><input id="wbDriverDoc" value="${esc(WB.driverDoc||'')}"></label>
    </div></div>
  </div>

  <div class="card">
    <div class="head"><h2>${esc(t('wbCargo'))}</h2><div class="grow"></div>
      ${inv?`<button class="btn sm" id="wbFromInv">${esc(t('wbCopyLines'))}</button>`:''}
      <button class="btn sm primary" id="wbAddLine">${esc(t('wbAddLine'))}</button></div>
    <div class="body tight"><div class="tblwrap" style="border:0">
      <table id="wbTbl"><thead><tr>
        <th style="min-width:200px">${esc(t('wbLnName'))}</th>
        <th style="width:96px">${esc(t('wbLnCode'))}</th>
        <th class="num" style="width:80px">${esc(t('wbLnQty'))}</th>
        <th style="width:82px">${esc(t('wbLnUnit'))}</th>
        <th class="num" style="width:84px">${esc(t('wbLnPacks'))}</th>
        <th class="num" style="width:104px">${esc(t('wbLnWeight'))}</th>
        <th class="num" style="width:100px">${esc(t('wbLnValue'))}</th>
        <th style="width:34px"></th></tr></thead>
        <tbody id="wbBody"></tbody>
        <tfoot id="wbFoot"></tfoot></table>
    </div></div>
  </div>

  <div class="card"><div class="body">
    <label class="f"><span class="l">${esc(t('wbNotes'))}</span>
      <textarea id="wbNotes" placeholder="${esc(t('wbNotesPh'))}">${esc(WB.notes||'')}</textarea></label>
    ${st==='delivered'?`<div class="grid2" style="margin-top:12px">
      <label class="f"><span class="l">${esc(t('wbReceivedBy'))}</span><input id="wbRecv" value="${esc(WB.receivedBy||'')}"></label>
      <label class="f"><span class="l">${esc(t('wbDelivered'))}</span><input type="date" id="wbDelAt" value="${esc(WB.deliveredAt||'')}"></label>
    </div>`:''}
  </div></div>

  <div class="actionbar">
    <button class="btn primary" id="wbSave">${esc(t('edSave'))}</button>
    <button class="btn" id="wbPdf">${esc(t('edPdf'))}</button>
    <div class="grow"></div>
    ${WB.isNew?'':`
      ${st!=='delivered'?`<button class="btn good" id="wbDeliver">${esc(t('wbMarkDelivered'))}</button>`:''}
      ${inv?'':`<button class="btn" id="wbMkInv">${esc(t('wbToInvoice'))}</button>`}
      <button class="btn" id="wbCopy">${esc(t('edCopy'))}</button>
      <button class="btn danger" id="wbDel">${esc(t('edDelete'))}</button>`}
  </div>`;

  renderWbLines();
  bindWaybill();
}

function renderWbLines(){
  $('#wbBody').innerHTML=(WB.lines||[]).map((l,i)=>`
    <tr data-i="${i}">
      <td data-c="name" data-lab="${esc(t('wbLnName'))}"><input data-k="name" value="${esc(l.name||'')}" placeholder="${esc(t('wbLnName'))}"></td>
      <td data-c="code" data-lab="${esc(t('wbLnCode'))}"><input data-k="code" value="${esc(l.code||'')}"></td>
      <td data-c="qty" data-lab="${esc(t('wbLnQty'))}"><input data-k="qty" type="number" step="any" value="${l.qty}"></td>
      <td data-c="unit" data-lab="${esc(t('wbLnUnit'))}"><input data-k="unit" value="${esc(l.unit||'')}"></td>
      <td data-c="packs" data-lab="${esc(t('wbLnPacks'))}"><input data-k="packs" type="number" step="any" value="${l.packs}"></td>
      <td data-c="weight" data-lab="${esc(t('wbLnWeight'))}"><input data-k="weight" type="number" step="any" value="${l.weight}"></td>
      <td data-c="value" data-lab="${esc(t('wbLnValue'))}"><input data-k="value" type="number" step="any" value="${l.value}"></td>
      <td data-c="del"><button class="icon-btn" data-del>✕</button></td>
    </tr>`).join('');
  const tt=wbTotals(WB);
  $('#wbFoot').innerHTML=`<tr><td colspan="4">${esc(t('wbTotals'))}</td>
    <td class="num">${tt.packs||'—'}</td><td class="num">${tt.weight?money(tt.weight):'—'}</td>
    <td class="num">${tt.value?money(tt.value):'—'}</td><td></td></tr>`;
  $$('#wbBody tr').forEach(tr=>{
    const i=+tr.dataset.i;
    tr.querySelectorAll('input').forEach(inp=>{
      inp.oninput=()=>{
        const k=inp.dataset.k;
        WB.lines[i][k]=(k==='name'||k==='code'||k==='unit')?inp.value:num(inp.value);
        const tt2=wbTotals(WB);
        $('#wbFoot').innerHTML=`<tr><td colspan="4">${esc(t('wbTotals'))}</td>
          <td class="num">${tt2.packs||'—'}</td><td class="num">${tt2.weight?money(tt2.weight):'—'}</td>
          <td class="num">${tt2.value?money(tt2.value):'—'}</td><td></td></tr>`;
      };
      inp.onkeydown=e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          if(i===WB.lines.length-1){WB.lines.push(blankWbLine());renderWbLines();
            const r=$$('#wbBody input[data-k="name"]');r[r.length-1].focus();}
          else $$('#wbBody tr')[i+1].querySelector('[data-k="name"]').focus();
        }
      };
    });
    tr.querySelector('[data-del]').onclick=()=>{
      WB.lines.splice(i,1);
      if(!WB.lines.length)WB.lines.push(blankWbLine());
      renderWbLines();
    };
  });
}

function bindWaybill(){
  const bind=(id,key,ev)=>{const el=$('#'+id);if(el)el[ev||'oninput']=()=>{WB[key]=el.value;};};
  $('#wbBack').onclick=()=>{WB=null;go('waybills');};
  bind('wbNo','no');bind('wbPlace','place');
  bind('wbLoadAddr','loadAddr');bind('wbUnloadAddr','unloadAddr');
  bind('wbVehicle','vehicle');bind('wbTrailer','trailer');
  bind('wbDriver','driver');bind('wbDriverDoc','driverDoc');
  bind('wbNotes','notes');
  ['wbDate','wbLoadDate','wbUnloadDate'].forEach(id=>{
    const el=$('#'+id);if(!el)return;
    const key={wbDate:'date',wbLoadDate:'loadDate',wbUnloadDate:'unloadDate'}[id];
    el.onchange=()=>{WB[key]=el.value;};
  });
  const rv=$('#wbRecv');if(rv)rv.oninput=()=>{WB.receivedBy=rv.value;};
  const da=$('#wbDelAt');if(da)da.onchange=()=>{WB.deliveredAt=da.value;};

  const gi=$('#wbGoInv');if(gi)gi.onclick=()=>{WB=null;openInvoice(S.waybills.find(x=>x.id)&&null);};
  if(gi)gi.onclick=()=>{const id=WB.invoiceId;WB=null;openInvoice(id);};

  $$('#p-waybill [data-wbedit]').forEach(b=>b.onclick=()=>{
    const which=b.dataset.wbedit;
    customerModal(Object.assign({id:uid()},WB[which]||{}),c=>{
      WB[which]=partyOf(c);
      if(which==='carrier')WB.carrierSelf=false;
      $('#wbBox'+which.charAt(0).toUpperCase()+which.slice(1)).innerHTML=wbPartyCard(which);
      bindWaybill();
    });
  });
  const self=$('#wbSelf');
  if(self)self.onchange=()=>{
    WB.carrierSelf=self.checked;
    if(self.checked)WB.carrier=partyOf(S.seller);
    $('#wbBoxCarrier').innerHTML=wbPartyCard('carrier');
    bindWaybill();
  };
  const cq=$('#wbConsQ');
  if(cq){
    attachPartyCombo(cq,$('#wbConsMenu'),c=>{
      WB.consignee=partyOf(c);
      if(!WB.unloadAddr)WB.unloadAddr=c.address||'';
      const ua=$('#wbUnloadAddr');if(ua)ua.value=WB.unloadAddr;
      $('#wbBoxConsignee').innerHTML=wbPartyCard('consignee');
      bindWaybill();
    });
    $('#wbConsManual').onclick=()=>customerModal(null,c=>{
      S.customers.push(c);saveNow();
      WB.consignee=partyOf(c);
      $('#wbBoxConsignee').innerHTML=wbPartyCard('consignee');bindWaybill();
    });
    $('#wbConsReg').onclick=()=>registryModal(r=>{
      const c=customerFromRegistry(r);S.customers.push(c);saveNow();
      WB.consignee=partyOf(c);
      if(!WB.unloadAddr)WB.unloadAddr=c.address||'';
      const ua=$('#wbUnloadAddr');if(ua)ua.value=WB.unloadAddr;
      $('#wbBoxConsignee').innerHTML=wbPartyCard('consignee');bindWaybill();
    });
  }
  const fp=$('#wbFleetPick');
  if(fp)fp.onchange=()=>{
    const f=S.fleet.find(x=>x.id===fp.value);if(!f)return;
    WB.vehicle=[f.plate,f.make].filter(Boolean).join(' ');WB.trailer=f.trailer||'';
    $('#wbVehicle').value=WB.vehicle;$('#wbTrailer').value=WB.trailer;fp.value='';
  };
  const dp=$('#wbDriverPick');
  if(dp)dp.onchange=()=>{
    const d=S.drivers.find(x=>x.id===dp.value);if(!d)return;
    WB.driver=d.name;WB.driverDoc=d.doc||'';
    $('#wbDriver').value=WB.driver;$('#wbDriverDoc').value=WB.driverDoc;dp.value='';
  };
  $('#wbAddLine').onclick=()=>{WB.lines.push(blankWbLine());renderWbLines();
    const r=$$('#wbBody input[data-k="name"]');r[r.length-1]&&r[r.length-1].focus();};
  const fi=$('#wbFromInv');
  if(fi)fi.onclick=()=>{
    const inv=S.invoices.find(i=>i.id===WB.invoiceId);
    if(inv){fillWbFromInvoice(WB,inv);renderWaybill();toast(t('copied'));}
  };
  $('#wbSave').onclick=()=>{if(commitWaybill()){toast(t('saved'));render();}};
  $('#wbPdf').onclick=()=>{if(commitWaybill())printWaybill(WB);};
  const dl=$('#wbDeliver');
  if(dl)dl.onclick=()=>{
    WB.status='delivered';WB.deliveredAt=WB.deliveredAt||today();
    commitWaybill();renderWaybill();toast(t('wbStatusDelivered'));
  };
  const mk=$('#wbMkInv');
  if(mk)mk.onclick=()=>invoiceFromWaybill(WB);
  const cp=$('#wbCopy');
  if(cp)cp.onclick=()=>{
    const s=S.settings,copy=JSON.parse(JSON.stringify(WB));
    copy.id=uid();copy.seq=s.wbNext;copy.no=makeWbNumber(s.wbNext);
    copy.date=today();copy.status='draft';copy.deliveredAt='';copy.receivedBy='';
    copy.lines=(copy.lines||[]).map(l=>({...l,id:uid()}));
    copy.isNew=true;WB=copy;renderWaybill();toast(t('copied'));
  };
  const dd=$('#wbDel');
  if(dd)dd.onclick=()=>confirmBox(WB.no||'',()=>{
    S.waybills=S.waybills.filter(x=>x.id!==WB.id);
    WB=null;saveNow();toast(t('deleted'));go('waybills');
  });
}

/* Waybill -> invoice, for the "deliver first, bill later" order of work. */
function invoiceFromWaybill(w){
  newInvoice();
  const saved=S.customers.find(c=>c.code&&w.consignee&&c.code===w.consignee.code)
           || S.customers.find(c=>w.consignee&&c.name===w.consignee.name);
  setBuyer(saved||Object.assign({id:null},w.consignee||{}));
  const rate=S.settings.vatPayer?num(S.settings.vatRate):0;
  const lines=(w.lines||[]).filter(l=>String(l.name||'').trim());
  if(lines.length)EDIT.lines=lines.map(l=>({
    id:uid(),name:l.name,qty:num(l.qty)||1,unit:l.unit||S.settings.unit,
    price:num(l.qty)?r2(num(l.value)/num(l.qty)):num(l.value),disc:0,vat:rate}));
  EDIT.notes=[EDIT.notes,(LANG==='lt'?'Pagal važtaraštį ':'Per waybill ')+w.no].filter(Boolean).join('\n');
  EDIT.waybillId=w.id;
  renderEditor();
  toast(t('wbToInvoice'));
}

/* The consignee picker reuses the invoice buyer combo, minus the buyer-only
   side effects, so registry search works here too. */
function attachPartyCombo(input,menu,onPick){
  let hi=-1,opts=[],timer=null;
  const closeM=()=>{menu.classList.remove('on');hi=-1;};
  const draw=()=>{
    const q=input.value.trim(),nq=normQ(q);
    opts=[];let html='';
    if(nq.length>=1){
      const saved=S.customers.filter(c=>normQ(c.name+' '+(c.code||'')+' '+(c.address||'')).includes(nq)).slice(0,6);
      if(saved.length){
        html+=`<div class="head-opt">${esc(t('savedCustomers'))}</div>`;
        saved.forEach(c=>{opts.push({kind:'cust',c});
          html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">${esc(c.name)}</div>
            <div class="s">${esc([c.code,(c.address||'').split(',')[0]].filter(Boolean).join(' · '))}</div></div>`;});
      }
    }
    if(nq.length>=3){
      if(REG.state==='ready'){
        const hits=REG.search(q,12);
        if(hits.length){
          html+=`<div class="head-opt">${esc(t('registryResults'))}</div>`;
          hits.forEach(r=>{opts.push({kind:'reg',r});
            html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">${esc(r.name)}</div>
              <div class="s">${esc([r.code,r.address].filter(Boolean).join(' · '))}</div></div>`;});
        }else if(!opts.length)html+=`<div class="opt muted">${esc(t('regNoRes'))}</div>`;
      }else if(REG.state==='loading')html+=`<div class="opt muted">${esc(t('regLoading'))}</div>`;
      else{opts.push({kind:'load'});
        html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">⤓ ${esc(t('regLoad'))}</div>
          <div class="s">${esc(t('regTitle'))} · 6.4 MB</div></div>`;}
    }
    if(!html){closeM();return;}
    menu.innerHTML=html;menu.classList.add('on');
    menu.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  };
  const pick=i=>{
    const o=opts[i];if(!o)return;
    if(o.kind==='load'){closeM();loadRegistryWithProgress().then(ok=>{if(ok){draw();input.focus();}});return;}
    closeM();
    if(o.kind==='cust'){onPick(o.c);return;}
    const c=customerFromRegistry(o.r);
    S.customers.push(c);saveNow();onPick(c);
  };
  input.oninput=()=>{clearTimeout(timer);timer=setTimeout(draw,140);};
  input.onfocus=()=>{if(REG.state==='idle')REG.loadIfCached().then(ok=>{if(ok&&input.value.trim().length>=3)draw();});draw();};
  input.onkeydown=e=>{
    const cells=Array.from(menu.querySelectorAll('[data-i]'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();if(!cells.length)return;
      hi=Math.max(0,Math.min(cells.length-1,hi+(e.key==='ArrowDown'?1:-1)));
      cells.forEach((c,n)=>c.classList.toggle('hi',n===hi));
      cells[hi].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(hi>=0&&cells[hi])pick(+cells[hi].dataset.i);
      else if(cells.length===1)pick(+cells[0].dataset.i);
    }else if(e.key==='Escape')closeM();
  };
  const onDocClick=ev=>{
    if(!menu.isConnected){document.removeEventListener('click',onDocClick,true);return;}
    if(!menu.parentElement.contains(ev.target))closeM();
  };
  document.addEventListener('click',onDocClick,true);
}

const CLOUD_SQL=`-- Sąskaitos faktūros — Supabase schema.
-- Run once: Supabase → SQL Editor → paste → Run.
-- One workspace = one JSON document. Locked to signed-in sessions: the
-- publishable/anon key alone grants nothing.

create table if not exists public.invoice_workspaces (
  id          text primary key,
  data        jsonb not null,
  updated_at  timestamptz not null default now(),
  updated_by  text
);

alter table public.invoice_workspaces enable row level security;
drop policy if exists iw_all on public.invoice_workspaces;
create policy iw_all on public.invoice_workspaces
  for all to authenticated using (true) with check (true);

-- Then: Authentication → Users → Add user (email + password).

function download(name,text,mime){

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();

}

function importBackup(file){

  rd.onload=()=>{
    try{
      const p=JSON.parse(rd.result);
      if(!p||typeof p!=='object'||!('invoices'in p))throw new Error('shape');
      adopt(p);

<script>
/* =========================================================================
   Minimal ZIP writer — "export everything" ships one archive holding the JSON
   backup, four CSVs, a printable HTML per invoice and a UBL XML per invoice.
   No library: entries are deflated with CompressionStream when the browser has
   it and stored uncompressed otherwise.
   ========================================================================= */
const CRC_TABLE=(()=>{
  const tb=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);tb[n]=c>>>0;}
  return tb;
})();
function crc32(buf){
  let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
async function deflateRaw(bytes){
  if(typeof CompressionStream!=='function')return null;
  try{
    const cs=new CompressionStream('deflate-raw');
    const ab=await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();
    return new Uint8Array(ab);
  }catch(e){return null;}
}
/* files: [{name, text}] or [{name, bytes}] */
async function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];
  let offset=0;
  const dt=new Date();
  const dosTime=((dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1))&0xFFFF;
  const dosDate=(((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate())&0xFFFF;
  for(const f of files){
    const nameB=enc.encode(f.name);
    const raw=f.bytes||enc.encode(f.text||'');
    const crc=crc32(raw);
    const comp=await deflateRaw(raw);
    const useDeflate=!!comp&&comp.length<raw.length;
    const body=useDeflate?comp:raw;
    const method=useDeflate?8:0;

    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,method,true); lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,body.length,true); lh.setUint32(22,raw.length,true);
    lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nameB,body);

    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true); ch.setUint16(10,method,true);
    ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,body.length,true); ch.setUint32(24,raw.length,true);
    ch.setUint16(28,nameB.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);

    offset+=30+nameB.length+body.length;
  }
  const cdStart=offset;
  let cdSize=0;
  central.forEach(c=>cdSize+=c.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);
  end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,cdStart,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}

  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  return '﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');

/* darken/lighten a #rrggbb by pct */
function shade(hex,pct){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||''));
  if(!m)return '#1e3aa8';
  const n=parseInt(m[1],16);
  const f=c=>Math.max(0,Math.min(255,Math.round(c+(pct/100)*(pct<0?c:255-c))));
  return '#'+[f(n>>16&255),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* The printable document. Also used verbatim by the ZIP export, which is why
   it returns a string instead of writing to a window. */
function invoiceHtml(inv,opt){
  opt=opt||{};
  const s=S.seller,b=inv.buyer||{},c=calc(inv),cfg=S.settings,br=Object.assign(blankBrand(),S.brand||{});
  const showD=cfg.showDisc&&(inv.lines||[]).some(l=>num(l.disc));
  const cy=inv.currency||cur();
  const banks=(s.banks||[]).filter(x=>x.iban);
  const paid=invStatus(inv)==='paid';

  const cols=1+(br.showLineNo?0:0);
  const head=[br.showLineNo?`<th class="c" style="width:26px">${esc(t('pdfNo'))}</th>`:'',
    `<th>${esc(t('pdfItem'))}</th>`,
    `<th class="c">${esc(t('pdfQty'))}</th>`,
    br.showUnit?`<th class="c">${esc(t('pdfUnit'))}</th>`:'',
    `<th class="r">${esc(t('pdfPrice'))}</th>`,
    showD?`<th class="r">${esc(t('pdfDisc'))}</th>`:'',
    br.showVatCol?`<th class="r">${esc(t('pdfVatRate'))}</th>`:'',
    `<th class="r">${esc(t('pdfSum'))}</th>`].filter(Boolean).join('');
  const span=head.split('<th').length-1;

  const rows=(inv.lines||[]).filter(l=>String(l.name||'').trim()||num(l.price)).map((l,i)=>
    '<tr>'+[br.showLineNo?`<td class="c">${i+1}</td>`:'',
      `<td>${esc(l.name)}</td>`,
      `<td class="c">${num(l.qty)}</td>`,
      br.showUnit?`<td class="c">${esc(l.unit||'')}</td>`:'',
      `<td class="r">${money(l.price)}</td>`,
      showD?`<td class="r">${num(l.disc)?num(l.disc)+'%':'—'}</td>`:'',
      br.showVatCol?`<td class="r">${num(l.vat)}%</td>`:'',
      `<td class="r">${money(lineNet(l))}</td>`].filter(Boolean).join('')+'</tr>').join('');

  const party=(title,p,extra)=>`
    <div class="pty"><div class="pl">${esc(title)}</div>
      <div class="pn">${esc(p.name||'')}</div>
      <div class="pv">${[
        p.code?`${t('pdfCode')} ${p.code}`:'',
        p.vat?`${t('pdfVat')} ${p.vat}`:'',
        p.address||'',p.phone||'',p.email||''
      ].filter(Boolean).map(esc).join('<br>')}${extra||''}</div></div>`;

  const body=`
<div class="wrap">
  ${paid&&br.paidStamp?`<div class="paidmark">${esc(t('pdfPaid')).toUpperCase()}</div>`:''}
  <div class="top">
    <div>${br.showLogo&&s.logo?`<img class="brandimg" src="${s.logo}">`
        :`<span class="logo">${esc((s.name||'SF').slice(0,3).toUpperCase())}</span>`}
      <div class="sname">${esc(s.name||'')}</div>
      ${br.headline?`<div class="headline">${esc(br.headline)}</div>`:''}</div>
    <div class="doc"><h1>${esc(docTitle(inv))}</h1>
      <div class="meta">${esc(t('pdfSeriesNo'))} <b>${esc(inv.no||'')}</b><br>
        ${esc(t('pdfDate'))}: ${esc(fmtDate(inv.date))}<br>
        ${esc(t('pdfDue'))}: <b>${esc(fmtDate(inv.dueDate))}</b></div></div>
  </div>
  <div class="rule"></div>
  <div class="parties">
    ${party(t('pdfSeller'),s,'')}
    ${party(t('pdfBuyer'),b,b.contact?'<br>'+esc(b.contact):'')}
  </div>
  <table><thead><tr>${head}</tr></thead>
    <tbody>${rows||`<tr><td colspan="${span}" class="c">—</td></tr>`}</tbody></table>
  <div class="totals">
    <div class="tr"><div class="tl">${esc(t('pdfSubtotal'))}</div><div class="tv">${money(c.net)} ${esc(cy)}</div></div>
    ${c.vatRows.filter(v=>v.rate>0).map(v=>`<div class="tr"><div class="tl">${esc(t('pdfVatSum'))} ${v.rate}%</div><div class="tv">${money(v.amt)} ${esc(cy)}</div></div>`).join('')}
    <div class="grand"><div class="tl">${esc(t('pdfTotal'))}</div><div class="tv">${money(c.total)} ${esc(cy)}</div></div>
    ${c.paid?`<div class="tr" style="margin-top:8px"><div class="tl">${esc(t('pdfPaid'))}</div><div class="tv">${money(c.paid)} ${esc(cy)}</div></div>
      <div class="tr"><div class="tl"><b>${esc(t('pdfDueNow'))}</b></div><div class="tv"><b>${money(c.due)} ${esc(cy)}</b></div></div>`:''}
  </div>
  ${br.showWords?`<div class="words"><div class="wl">${esc(t('pdfWords'))}</div><b>${esc(amountWords(c.total))}</b></div>`:''}
  ${br.showBank&&banks.length?`<div class="bank"><div class="bl">${esc(t('setBanks'))}</div><div class="bi">
     ${banks.map(k=>esc([k.bank,k.iban,k.swift].filter(Boolean).join('  ·  '))).join('<br>')}</div></div>`:''}
  ${br.showNotes&&inv.notes?`<div class="remarks"><div class="rl">${esc(t('pdfNotes'))}</div>${esc(inv.notes)}</div>`:''}
  ${br.showSign?`<div class="signs">
     <div class="sig"><div class="sl">${esc(t('pdfIssued'))}</div>
       <div class="sline">${br.stamp?`<img class="stamp" src="${br.stamp}">`:''}</div>
       <div class="sn">${esc(inv.issuer||s.director||'')}</div></div>
     <div class="sig"><div class="sl">${esc(t('pdfReceived'))}</div><div class="sline"></div>
       <div class="sn">${esc(inv.receiver||'')}</div></div>
   </div>`:''}
  ${br.showFooter?`<div class="foot"><div>${esc(cfg.footer||'')}</div>
    <div>${esc([s.web,s.email,s.phone].filter(Boolean).join(' · '))}</div></div>`:''}
</div>`;

  if(opt.bodyOnly)return `<style>${brandCss(br)}</style>`+body;
  return `<!DOCTYPE html><html lang="${LANG}"><head><meta charset="utf-8">
<title>${esc(docTitle(inv))} ${esc(inv.no)}</title>
<style>${brandCss(br)}</style></head><body>
${opt.standalone?'':`<div class="noprint"><button onclick="window.print()">${esc(t('pdfPrintSave'))}</button></div>`}
${body}
${opt.standalone?'':'<script>window.onload=function(){setTimeout(function(){try{window.print()}catch(e){}},380)}<\/script>'}
</body></html>`;
}

    <tbody>${rows||'<tr><td colspan="8" class="c">—</td></tr>'}</tbody>

  if(opt.bodyOnly)return `<style>${brandCss(br)}${extra}</style>`+body;

${body}
${opt.standalone?'':'<script>window.onload=function(){setTimeout(function(){try{window.print()}catch(e){}},380)}<\/script>'}

}
function printWaybill(w){
  const win=window.open('','_blank');
  if(!win){toast(t('popupBlocked'),true);return;}
  win.document.open();win.document.write(waybillHtml(w));win.document.close();
}
function printInvoice(inv){
  const w=window.open('','_blank');
  if(!w){toast(t('popupBlocked'),true);return;}
  w.document.open();w.document.write(invoiceHtml(inv));w.document.close();
}

/* =========================================================================
   Test bridge. Top-level const/let live in the global LEXICAL scope, which a
   parent window (test.html drives the app inside an iframe) cannot reach.
   Function declarations are already on window; this exposes the rest.
   ========================================================================= */
Object.defineProperties(window,{
  S:    {get:()=>S,    set:v=>{S=v},    configurable:true},
  EDIT: {get:()=>EDIT, set:v=>{EDIT=v}, configurable:true},
  VIEW: {get:()=>VIEW, set:v=>{VIEW=v}, configurable:true},
  LANG: {get:()=>LANG, configurable:true},
  I18N: {get:()=>I18N, configurable:true},
  REG:  {get:()=>REG,  configurable:true},
  Cloud:{get:()=>Cloud,configurable:true},
  WB:   {get:()=>WB,   set:v=>{WB=v}, configurable:true},
  STATE_V:{get:()=>STATE_V,configurable:true},
  CLOUD_SQL:{get:()=>CLOUD_SQL,configurable:true}
});
Object.assign(window,{t,esc,num,r2,uid,deacc,normQ,money,today,cur,lineNet,eurStr,shade});

/* ===================== boot ===================== */
function boot(){
  load();
  setLang(detectLang());
  LANGS.forEach(c=>{const b=$('#lang-'+c);if(b)b.onclick=()=>setLang(c);});
  $('#btnNewTop').onclick=newInvoice;
  $('#btnExport').onclick=exportBackup;
  $('#btnImport').onclick=()=>$('#fileIn').click();
  $('#fileIn').onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value='';};
  $('#cloudChip').onclick=cloudChipClick;
  $('#modalX').onclick=closeModal;
  $('#scrim').onclick=e=>{if(e.target===$('#scrim'))closeModal();};
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&$('#scrim').classList.contains('on'))closeModal();
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();
      if(VIEW==='editor'&&EDIT){if(commitInvoice()){toast(t('saved'));render();}}else{saveNow();toast(t('saved'));}}
  });
  const h=(location.hash||'').replace('#','');
  go(TABS.some(x=>x.id===h&&h!=='editor'&&h!=='waybill')?h:'dash');
  /* If the registry was downloaded before, bring it back silently. */
  REG.loadIfCached().then(ok=>{if(ok&&VIEW==='settings')paintRegPanel();});
  Cloud.load();paintCloud();Cloud.start();
  window.addEventListener('online',()=>{if(Cloud.on())Cloud.sync();});
  window.addEventListener('offline',()=>{if(Cloud.on()){Cloud.status='offline';paintCloud();}});
  window.addEventListener('beforeunload',saveNow);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
