<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Sąskaitos — tests</title>
<style>
 body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0f1218;color:#dfe4ec;margin:0;padding:18px;font-size:12.5px}
 h1{font-size:15px;margin:0 0 12px}
 .ok{color:#4ade80}.bad{color:#f87171}.info{color:#93a4bd}
 #sum{padding:9px 12px;border-radius:8px;margin:12px 0;font-weight:700;font-size:14px}
 #sum.pass{background:#12351f;color:#4ade80}#sum.fail{background:#3a1618;color:#f87171}
 .grp{color:#7dd3fc;margin-top:12px}
 iframe{position:absolute;left:-9999px;width:1200px;height:900px}
</style></head>
<body>
<h1>Sąskaitos faktūros — test suite</h1>
<div id="sum" class="info">running…</div>
<div id="out"></div>
<iframe id="app" src="index.html"></iframe>
<script>
let pass=0,fail=0;const out=document.getElementById('out');
function line(html,cls){const d=document.createElement('div');d.className=cls||'';d.innerHTML=html;out.appendChild(d);}
function grp(n){line('── '+n+' '+'─'.repeat(Math.max(0,52-n.length)),'grp');}
function ok(n,cond,extra){
  if(cond){pass++;line('  ✓ '+n,'ok');}
  else{fail++;line('  ✗ '+n+(extra?'  <span class="info">'+extra+'</span>':''),'bad');}
}
function eq(n,a,b){ok(n,a===b,'got '+JSON.stringify(a)+' want '+JSON.stringify(b));}
function near(n,a,b,eps){ok(n,Math.abs(a-b)<(eps||0.005),'got '+a+' want '+b);}

const frame=document.getElementById('app');
frame.onload=()=>setTimeout(run,320);

function finish(){
  const s=document.getElementById('sum');
  s.className=fail?'fail':'pass';
  s.textContent=(fail?'FAIL':'ALL_PASS')+'  —  '+pass+' passed, '+fail+' failed';
  document.title=(fail?'FAIL ':'ALL_PASS ')+pass+'/'+(pass+fail);
}
function blow(e){
  fail++;
  line('  ✗ EXCEPTION: '+e.message+'<br>'+(e.stack||'').split('\n').slice(0,4).join('<br>'),'bad');
}
/* the suite is part sync, part promise chain (cloud + zip are async) */
function run(){
  const W=frame.contentWindow,D=frame.contentDocument;
  let p;
  try{ p=tests(W,D); }
  catch(e){ blow(e); finish(); return; }
  Promise.resolve(p).then(finish,e=>{blow(e);finish();});
}

function tests(W,D){
  /* ---------------------------------------------------------------- */
  grp('boot');
  ok('app globals exist', typeof W.S==='object' && typeof W.calc==='function');
  ok('starts on dashboard', W.VIEW==='dash');
  ok('tab bar rendered', D.querySelectorAll('#tabbar button').length>=5);
  ok('blank state has no invoices', W.S.invoices.length===0);
  ok('default VAT rate is 21', W.S.settings.vatRate===21);

  /* ---------------------------------------------------------------- */
  grp('i18n');
  W.setLang('lt');
  eq('lt title', W.t('appTitle'), 'Sąskaitos faktūros');
  W.setLang('en');
  eq('en title', W.t('appTitle'), 'Invoices');
  ok('every lt key has an en twin',
     Object.keys(W.I18N.lt).every(k=>W.I18N.en[k]!==undefined),
     Object.keys(W.I18N.lt).filter(k=>W.I18N.en[k]===undefined).join(','));
  ok('every en key has a lt twin',
     Object.keys(W.I18N.en).every(k=>W.I18N.lt[k]!==undefined),
     Object.keys(W.I18N.en).filter(k=>W.I18N.lt[k]===undefined).join(','));
  ok('unknown key falls back to itself', W.t('__nope__')==='__nope__');
  W.setLang('lt');

  /* ---------------------------------------------------------------- */
  grp('money maths');
  const L=(q,p,v,d)=>({name:'x',qty:q,price:p,vat:v,disc:d||0});
  near('line net, no discount', W.lineNet(L(3,10,21)), 30);
  near('line net, 10% discount', W.lineNet(L(3,10,21,10)), 27);
  let inv={lines:[L(1,100,21)],payments:[]};
  let c=W.calc(inv);
  near('net', c.net, 100); near('vat 21%', c.vat, 21); near('total', c.total, 121);
  inv={lines:[L(1,100,21),L(2,50,9)],payments:[]};
  c=W.calc(inv);
  near('mixed net', c.net, 200);
  near('mixed vat', c.vat, 21+9);
  eq('two VAT bands', c.vatRows.length, 2);
  eq('bands sorted ascending', c.vatRows[0].rate, 9);
  near('band base 9%', c.vatRows[0].base, 100);
  inv={lines:[L(1,100,0)],payments:[]};
  near('zero-rated has no VAT', W.calc(inv).vat, 0);
  /* rounding: 3 x 33.33 @21% must not drift */
  inv={lines:[L(3,33.33,21)],payments:[]};
  c=W.calc(inv);
  near('rounds to cents', c.total, 120.99);
  /* payments */
  inv={lines:[L(1,100,21)],payments:[{amount:50}]};
  c=W.calc(inv);
  near('paid', c.paid, 50); near('balance due', c.due, 71);

  /* ---------------------------------------------------------------- */
  grp('status');
  const yday=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const tmrw=new Date(Date.now()+864e5).toISOString().slice(0,10);
  eq('draft stays draft', W.invStatus({status:'draft',lines:[L(1,10,21)],payments:[]}), 'draft');
  eq('fully paid', W.invStatus({status:'sent',lines:[L(1,10,21)],payments:[{amount:12.1}]}), 'paid');
  eq('part paid', W.invStatus({status:'sent',lines:[L(1,10,21)],payments:[{amount:5}]}), 'part');
  eq('overdue', W.invStatus({status:'sent',dueDate:yday,lines:[L(1,10,21)],payments:[]}), 'over');
  eq('not yet due', W.invStatus({status:'sent',dueDate:tmrw,lines:[L(1,10,21)],payments:[]}), 'sent');

  /* ---------------------------------------------------------------- */
  grp('numbering');
  W.S.settings.series='SF';W.S.settings.format='{S}-{YYYY}-{NNNN}';
  const yr=new Date().getFullYear();
  eq('padded number', W.makeNumber(7), 'SF-'+yr+'-0007');
  W.S.settings.format='{S}{YY}/{N}';
  eq('short format', W.makeNumber(42), 'SF'+String(yr).slice(2)+'/42');
  W.S.settings.format='{S}-{MM}-{NNN}';
  eq('month token', W.makeNumber(5), 'SF-'+String(new Date().getMonth()+1).padStart(2,'0')+'-005');
  W.S.settings.format='{S}-{YYYY}-{NNNN}';

  /* ---------------------------------------------------------------- */
  grp('amount in words (LT)');
  W.setLang('lt');
  eq('1',      W.amountWords(1),      'Vienas euras 00 ct');
  eq('2',      W.amountWords(2),      'Du eurai 00 ct');
  eq('10',     W.amountWords(10),     'Dešimt eurų 00 ct');
  eq('11',     W.amountWords(11),     'Vienuolika eurų 00 ct');
  eq('21',     W.amountWords(21),     'Dvidešimt vienas euras 00 ct');
  eq('100',    W.amountWords(100),    'Šimtas eurų 00 ct');
  eq('200',    W.amountWords(200),    'Du šimtai eurų 00 ct');
  eq('1000',   W.amountWords(1000),   'Tūkstantis eurų 00 ct');
  eq('1001',   W.amountWords(1001),   'Tūkstantis vienas euras 00 ct');
  eq('1000000',W.amountWords(1000000),'Milijonas eurų 00 ct');
  eq('2000',   W.amountWords(2000),   'Du tūkstančiai eurų 00 ct');
  eq('11000',  W.amountWords(11000),  'Vienuolika tūkstančių eurų 00 ct');
  eq('cents',  W.amountWords(1234.56),'Tūkstantis du šimtai trisdešimt keturi eurai 56 ct');
  eq('zero',   W.amountWords(0),      'Nulis eurų 00 ct');
  W.setLang('en');
  eq('en 1',    W.amountWords(1),    'One euro 00 cents');
  eq('en 1234', W.amountWords(1234.5),'One thousand two hundred and thirty-four euros 50 cents');
  W.setLang('lt');

  /* ---------------------------------------------------------------- */
  grp('helpers');
  eq('deacc folds Lithuanian', W.deacc('ąčęėįšųūž'), 'aceeisuuz');
  eq('normQ lowercases + folds', W.normQ('UAB Ąžuolas'), 'uab azuolas');
  eq('deacc keeps length', W.deacc('šiaulių').length, 'šiaulių'.length);
  eq('slug', W.slug('UAB "Ąžuolas" ir Ko'), 'uab-azuolas-ir-ko');
  eq('num accepts comma', W.num('12,50'), 12.5);
  eq('num on junk is 0', W.num('abc'), 0);
  eq('addDays', W.addDays('2026-01-30',2), '2026-02-01');
  eq('addDays over a year end', W.addDays('2026-12-31',1), '2027-01-01');
  eq('addDays leap day', W.addDays('2028-02-28',1), '2028-02-29');
  eq('daysBetween', W.daysBetween('2026-01-01','2026-01-15'), 14);
  eq('esc escapes', W.esc('<b>&"'), '&lt;b&gt;&amp;&quot;');

  /* ---------------------------------------------------------------- */
  grp('invoice lifecycle');
  W.S.invoices=[];W.S.customers=[];W.S.settings.next=1;
  W.newInvoice();
  ok('editor opened', W.VIEW==='editor' && !!W.EDIT);
  eq('number assigned', W.EDIT.no, 'SF-'+yr+'-0001');
  eq('one blank line', W.EDIT.lines.length, 1);
  ok('save refused without buyer', W.commitInvoice()===false);
  const cust={id:'c1',kind:'company',name:'UAB Bandymas',code:'123456789',vat:'LT123456715',address:'Vilnius'};
  W.S.customers.push(cust);
  W.setBuyer(cust);
  eq('buyer snapshot name', W.EDIT.buyer.name, 'UAB Bandymas');
  eq('customerId linked', W.EDIT.customerId, 'c1');
  ok('save refused without lines', W.commitInvoice()===false);
  W.EDIT.lines=[{id:'l1',name:'Baldų gamyba',qty:2,unit:'vnt',price:250,disc:0,vat:21}];
  ok('save accepted', W.commitInvoice()===true);
  eq('stored', W.S.invoices.length, 1);
  eq('next number advanced', W.S.settings.next, 2);
  near('stored total', W.calc(W.S.invoices[0]).total, 605);
  /* editing an existing invoice must update, not append */
  const id=W.S.invoices[0].id;
  W.openInvoice(id);
  W.EDIT.lines[0].qty=3;
  W.commitInvoice();
  eq('still one invoice', W.S.invoices.length, 1);
  near('updated total', W.calc(W.S.invoices[0]).total, 907.5);
  /* duplicate */
  W.duplicateInvoice();
  eq('duplicate is a draft', W.EDIT.status, 'draft');
  ok('duplicate got a new number', W.EDIT.no!=='SF-'+yr+'-0001');
  ok('duplicate has no payments', W.EDIT.payments.length===0);
  ok('duplicate not stored until saved', W.S.invoices.length===1);
  W.commitInvoice();
  eq('now two invoices', W.S.invoices.length, 2);
  /* catalogue usage must count once per invoice, not once per save */
  W.S.items=[{id:'it1',name:'Montavimas',unit:'val',price:35,vat:21,used:0}];
  W.newInvoice(); W.setBuyer(cust);
  W.EDIT.lines=[{id:'z',name:'Montavimas',qty:1,unit:'val',price:35,disc:0,vat:21,itemId:'it1'}];
  W.commitInvoice(); W.commitInvoice(); W.commitInvoice();
  eq('usage counted once across three saves', W.S.items[0].used, 1);
  W.S.invoices.pop(); W.S.items=[];

  /* ---------------------------------------------------------------- */
  grp('persistence');
  W.saveNow();
  const raw=JSON.parse(W.localStorage.getItem('inv_state_v1'));
  eq('localStorage has both invoices', raw.invoices.length, 2);
  eq('localStorage has the customer', raw.customers.length, 1);

  /* ---------------------------------------------------------------- */
  grp('exports');
  const xml=[];
  const realDl=W.download;
  W.download=(n,txt)=>xml.push([n,txt]);
  W.exportUbl(W.S.invoices[0]);
  ok('UBL file name', xml.length===1 && /\.xml$/.test(xml[0][0]));
  const x=xml[0][1];
  ok('UBL declares EN16931', x.includes('urn:cen.eu:en16931:2017'));
  ok('UBL carries the buyer VAT id', x.includes('LT123456715'));
  ok('UBL total matches', x.includes('<cbc:PayableAmount currencyID="EUR">907.50'));
  ok('UBL has one line per invoice line', (x.match(/<cac:InvoiceLine>/g)||[]).length===1);
  ok('UBL is well-formed XML',
     !new DOMParser().parseFromString(x,'application/xml').querySelector('parsererror'));
  xml.length=0;
  W.exportCsv(W.S.invoices);
  ok('CSV produced', xml.length===1 && /\.csv$/.test(xml[0][0]));
  ok('CSV is semicolon separated with a BOM', xml[0][1].startsWith('﻿"Nr"'));
  eq('CSV row count', xml[0][1].trim().split('\r\n').length, 3);
  xml.length=0;
  W.exportBackup();
  ok('backup is valid JSON', (()=>{try{JSON.parse(xml[0][1]);return true}catch(e){return false}})());
  W.download=realDl;

  /* ---------------------------------------------------------------- */
  grp('state migration');
  eq('current version', W.STATE_V, 5);
  const v1={v:1,invoices:[],customers:[],items:[],
            seller:{name:'A'},settings:{series:'X',showWords:false,showSign:false,vatRate:9}};
  W.adopt(JSON.parse(JSON.stringify(v1)));
  eq('version bumped', W.S.v, 5);
  eq('brand created', typeof W.S.brand, 'object');
  eq('showWords moved into brand', W.S.brand.showWords, false);
  eq('showSign moved into brand', W.S.brand.showSign, false);
  ok('old keys dropped from settings', W.S.settings.showWords===undefined && W.S.settings.showSign===undefined);
  eq('own settings preserved', W.S.settings.series, 'X');
  eq('unset settings defaulted', W.S.settings.term, 14);
  eq('seller defaults filled', W.S.seller.banks.length, 1);
  W.adopt({invoices:[],customers:[],items:[]});
  eq('a fresh doc gets brand defaults', W.S.brand.template, 'modern');
  ok('v1 doc gains waybill collections',
     Array.isArray(W.S.waybills) && Array.isArray(W.S.fleet) && Array.isArray(W.S.drivers));
  const v2={v:2,invoices:[],customers:[],items:[],brand:{template:'classic'},settings:{series:'Y'}};
  const m2=W.migrate(JSON.parse(JSON.stringify(v2)));
  eq('v2 -> v3 keeps the brand', m2.brand.template, 'classic');
  eq('v2 -> v5 bumps the version', m2.v, 5);
  eq('migrating a current doc is a no-op',
     W.migrate({v:5,brand:{template:'minimal'},waybills:[{id:'x'}]}).waybills.length, 1);
  /* v3 -> v4: the single driver becomes a crew */
  const m3=W.migrate({v:3,waybills:[
    {id:'a',driver:'Jonas Jonaitis',driverDoc:'AA1'},
    {id:'b',driver:'',driverDoc:''},
    {id:'c',drivers:[{name:'Jau masyvas',doc:'X'}]}]});
  eq('v3 -> v5 version', m3.v, 5);
  eq('single driver became a one-entry crew', m3.waybills[0].drivers.length, 1);
  eq('driver name kept', m3.waybills[0].drivers[0].name, 'Jonas Jonaitis');
  eq('licence kept', m3.waybills[0].drivers[0].doc, 'AA1');
  ok('old scalar fields dropped',
     m3.waybills[0].driver===undefined && m3.waybills[0].driverDoc===undefined);
  eq('an empty driver yields an empty crew', m3.waybills[1].drivers.length, 0);
  eq('an existing crew is left alone', m3.waybills[2].drivers[0].name, 'Jau masyvas');

  /* ---------------------------------------------------------------- */
  grp('važtaraštis');
  W.S.settings.wbSeries='VŽ';W.S.settings.wbFormat='{S}-{YYYY}-{NNNN}';W.S.settings.wbNext=1;
  W.S.waybills=[];W.S.fleet=[];W.S.drivers=[];
  W.S.seller={...W.S.seller,name:'Vežėjas UAB',code:'302475348',vat:'LT100005781213',
              address:'Vilnius, Gedimino pr. 1',director:'R. G.'};
  const yr2=new Date().getFullYear();
  eq('waybill numbering is separate', W.makeWbNumber(3), 'VŽ-'+yr2+'-0003');
  eq('invoice numbering unaffected', W.makeNumber(3), 'SF-'+yr2+'-0003');
  ok('the two series never collide', W.makeWbNumber(1)!==W.makeNumber(1));

  W.newWaybill();
  ok('editor opened', W.VIEW==='waybill' && !!W.WB);
  eq('number assigned', W.WB.no, 'VŽ-'+yr2+'-0001');
  eq('consignor defaults to the seller', W.WB.consignor.name, 'Vežėjas UAB');
  eq('carrier defaults to us', W.WB.carrierSelf, true);
  eq('one blank cargo line', W.WB.lines.length, 1);
  ok('save refused without a consignee', W.commitWaybill()===false);
  W.WB.consignee={name:'UAB Gavėjas',code:'123456789',vat:'',address:'Kaunas, Laisvės al. 1'};
  ok('save refused without cargo', W.commitWaybill()===false);
  W.WB.lines=[{id:'a',name:'Virtuvės baldai',code:'K-1',unit:'kompl.',qty:1,packs:6,weight:240.5,value:4850},
              {id:'b',name:'Stalviršis',code:'S-2',unit:'vnt',qty:2,packs:2,weight:59.5,value:290}];
  W.WB.vehicle='ABC 123 Mercedes Sprinter';
  W.WB.loadAddr='Vilnius, Gedimino pr. 1';W.WB.unloadAddr='Kaunas, Laisvės al. 1';
  ok('save accepted', W.commitWaybill()===true);
  eq('stored', W.S.waybills.length, 1);
  eq('next waybill number advanced', W.S.settings.wbNext, 2);
  eq('invoice counter untouched', W.S.settings.next, 1);

  const tot=W.wbTotals(W.S.waybills[0]);
  eq('packages summed', tot.packs, 8);
  near('weight summed', tot.weight, 300);
  near('value summed', tot.value, 5140);

  eq('a saved waybill is issued, not draft', W.wbStatus({status:'issued'}), 'issued');
  eq('delivered wins', W.wbStatus({status:'delivered'}), 'delivered');
  eq('draft stays draft', W.wbStatus({status:'draft'}), 'draft');

  /* ---- crew of drivers ---- */
  eq('a new waybill starts with one driver slot', W.wbDrivers(W.S.waybills[0]).length, 1);
  W.S.waybills[0].drivers=[{name:'Jonas Jonaitis',doc:'AA123456'},
                           {name:'Petras Petraitis',doc:'BB998877'}];
  eq('two drivers held', W.wbDrivers(W.S.waybills[0]).length, 2);
  eq('names joined for the document', W.wbDriverNames(W.S.waybills[0]), 'Jonas Jonaitis, Petras Petraitis');
  eq('licences joined too', W.wbDriverDocs(W.S.waybills[0]), 'AA123456, BB998877');
  eq('a blank name is skipped', W.wbDriverNames({drivers:[{name:'A',doc:''},{name:'',doc:'Z'}]}), 'A');
  /* a legacy document still reads correctly without migration */
  eq('legacy single driver reads as a crew', W.wbDrivers({driver:'Senas',driverDoc:'S1'}).length, 1);
  eq('legacy driver name', W.wbDriverNames({driver:'Senas',driverDoc:'S1'}), 'Senas');
  eq('no drivers at all is an empty crew', W.wbDrivers({}).length, 0);
  eq('empty crew joins to an empty string', W.wbDriverNames({}), '');

  /* invoice -> waybill */
  W.S.invoices=[];W.S.settings.next=1;
  W.newInvoice();
  const wbCust={id:'wc1',kind:'company',name:'UAB Pirkėjas',code:'987654321',vat:'LT987654313',address:'Klaipėda, Taikos pr. 5'};
  W.S.customers.push(wbCust);
  W.setBuyer(wbCust);
  W.EDIT.lines=[{id:'l1',name:'Spinta',qty:3,unit:'vnt',price:400,disc:0,vat:21}];
  W.commitInvoice();
  const srcInv=W.S.invoices[0];
  W.newWaybill(srcInv);
  eq('linked to the invoice', W.WB.invoiceId, srcInv.id);
  eq('buyer became the consignee', W.WB.consignee.name, 'UAB Pirkėjas');
  eq('consignee keeps the company code', W.WB.consignee.code, '987654321');
  eq('delivery address prefilled', W.WB.unloadAddr, 'Klaipėda, Taikos pr. 5');
  eq('invoice lines became cargo', W.WB.lines.length, 1);
  eq('cargo name carried', W.WB.lines[0].name, 'Spinta');
  eq('cargo quantity carried', W.WB.lines[0].qty, 3);
  near('cargo value is the line net', W.WB.lines[0].value, 1200);
  ok('notes reference the invoice', String(W.WB.notes).indexOf(srcInv.no)>=0);
  ok('weight is left blank for the user', W.WB.lines[0].weight===0);
  W.commitWaybill();
  eq('two waybills now', W.S.waybills.length, 2);

  /* waybill -> invoice */
  const wbForInv=W.S.waybills[1];
  W.S.settings.vatRate=21;W.S.settings.vatPayer=true;
  W.invoiceFromWaybill(wbForInv);
  eq('invoice editor opened', W.VIEW, 'editor');
  eq('consignee became the buyer', W.EDIT.buyer.name, 'UAB Pirkėjas');
  eq('cargo became invoice lines', W.EDIT.lines.length, 1);
  near('unit price derived from value/qty', W.EDIT.lines[0].price, 400);
  eq('VAT rate applied', W.EDIT.lines[0].vat, 21);
  ok('notes reference the waybill', String(W.EDIT.notes).indexOf(wbForInv.no)>=0);
  near('invoice total round-trips', W.calc(W.EDIT).total, 1452);
  W.EDIT=null;

  /* printed document */
  W.WB=null;
  const wbDoc=W.waybillHtml(W.S.waybills[0],{standalone:true});
  ok('titled as a consignment note', wbDoc.indexOf(W.t('wbTitle'))>=0);
  ok('carries the waybill number', wbDoc.indexOf('VŽ-'+yr2+'-0001')>=0);
  ok('shows the consignor', wbDoc.indexOf('Vežėjas UAB')>=0);
  ok('shows the consignee', wbDoc.indexOf('UAB Gavėjas')>=0);
  ok('shows the vehicle', wbDoc.indexOf('ABC 123 Mercedes Sprinter')>=0);
  ok('shows every driver in the crew',
     wbDoc.indexOf('Jonas Jonaitis')>=0 && wbDoc.indexOf('Petras Petraitis')>=0);
  ok('shows every licence number',
     wbDoc.indexOf('AA123456')>=0 && wbDoc.indexOf('BB998877')>=0);
  ok('the carrier signature names the crew',
     wbDoc.split(W.t('wbSignCarrier'))[1].indexOf('Jonas Jonaitis')>=0);
  ok('the field label switches to plural for a crew', wbDoc.indexOf(W.t('wbDrivers'))>=0);
  ok('shows both route ends',
     wbDoc.indexOf('Vilnius, Gedimino pr. 1')>=0 && wbDoc.indexOf('Kaunas, Laisvės al. 1')>=0);
  eq('one row per cargo line', (wbDoc.match(/<tr><td class="c">\d+<\/td>/g)||[]).length, 2);
  ok('has three signature blocks', (wbDoc.match(/class="sig"/g)||[]).length===3);
  ok('signature blocks are labelled for all three parties',
     wbDoc.indexOf(W.t('wbSignConsignor'))>=0 && wbDoc.indexOf(W.t('wbSignCarrier'))>=0
     && wbDoc.indexOf(W.t('wbSignConsignee'))>=0);
  ok('standalone omits the print button', wbDoc.indexOf('<div class="noprint">')<0);
  ok('non-standalone has the print button', W.waybillHtml(W.S.waybills[0]).indexOf('<div class="noprint">')>=0);
  /* branding is shared with the invoice */
  W.S.brand.accent='#b45309';
  ok('waybill follows the invoice accent colour',
     W.waybillHtml(W.S.waybills[0],{standalone:true}).indexOf('#b45309')>=0);
  W.S.brand.accent='#2f54eb';
  const delivered={...W.S.waybills[0],status:'delivered'};
  ok('delivered stamp shows', W.waybillHtml(delivered,{standalone:true}).indexOf('<div class="paidmark">')>=0);
  ok('undelivered has no stamp', wbDoc.indexOf('<div class="paidmark">')<0);

/* The ZIP is parsed back out of the produced blob, so these check the archive
   a user actually receives rather than the array we fed in. */
/* Build a real .xlsx in the browser with the app's own ZIP writer, so the
   reader is tested against a genuine deflated archive and not a fixture. */
function xlsxBytes(W,sheets){
  const MAIN='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const REL='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const PKG='http://schemas.openxmlformats.org/package/2006/relationships';
  const strings=[],seen=new Map();
  const si=v=>{const k=String(v);if(!seen.has(k)){seen.set(k,strings.length);strings.push(k);}return seen.get(k);};
  const x=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const col=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;};
  const body=(rows,inline)=>'<?xml version="1.0" encoding="UTF-8"?>'+
    `<worksheet xmlns="${MAIN}"><sheetData>`+rows.map((r,ri)=>
      `<row r="${ri+1}">`+r.map((v,ci)=>{
        if(v===''||v==null)return '';
        const ref=col(ci)+(ri+1);
        if(typeof v==='number')return `<c r="${ref}"><v>${v}</v></c>`;
        return inline?`<c r="${ref}" t="inlineStr"><is><t>${x(v)}</t></is></c>`
                     :`<c r="${ref}" t="s"><v>${si(v)}</v></c>`;
      }).join('')+'</row>').join('')+'</sheetData></worksheet>';
  const bodies=sheets.map((sh,i)=>body(sh.rows,i>0));   /* sheet 2 uses inline strings */
  const files=[
    {name:'xl/workbook.xml',text:'<?xml version="1.0" encoding="UTF-8"?>'+
      `<workbook xmlns="${MAIN}" xmlns:r="${REL}"><sheets>`+
      sheets.map((sh,i)=>`<sheet name="${x(sh.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+
      '</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:'<?xml version="1.0" encoding="UTF-8"?>'+
      `<Relationships xmlns="${PKG}">`+sheets.map((sh,i)=>
      `<Relationship Id="rId${i+1}" Type="${REL}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+
      '</Relationships>'},
    {name:'xl/sharedStrings.xml',text:'<?xml version="1.0" encoding="UTF-8"?>'+
      `<sst xmlns="${MAIN}" count="${strings.length}" uniqueCount="${strings.length}">`+
      strings.map(v=>`<si><t>${x(v)}</t></si>`).join('')+'</sst>'}
  ];
  bodies.forEach((b,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',text:b}));
  return W.makeZip(files).then(blob=>blob.arrayBuffer());
}

  eq('the main series is not', list[0].type, 'invoice');

  eq('payments came off the second sheet', list[0].payments.length, 1);
  near('payment amount', list[0].payments[0].amount, 557.81);
  eq('payment date', list[0].payments[0].date, '2026-01-20');
  eq('paid invoice reads as paid', W.invStatus(list[0]), 'paid');
  eq('the cent-drift invoice is settled too', W.invStatus(list[1]), 'paid');
  eq('an invoice with no payment is not', W.calc(list[2]).due>0, true);
  /* no due-date column: the app's own term is used, not the invoice date */
  eq('due date follows the settings term', list[2].dueDate, '2026-03-15');
  eq('so an unpaid recent invoice is not instantly overdue', list[2].term, 14);

  const plan=W.importPlan(list);
  eq('all four are new', plan.fresh.length, 4);
  eq('four buyers', plan.newCust.length, 4);
  W.applyImport(plan,{adoptNumbering:true,syncPayments:true});
  eq('imported', W.S.invoices.length, 4);
  eq('numbering follows the main series', W.S.settings.series, 'DBSF');
  eq('next number', W.S.settings.next, 2890);

  /* a file that is not a zip, and a zip that is not a workbook */
  let threw='';
  try{W.readZip(new Uint8Array([1,2,3,4,5]).buffer);}catch(e){threw=String(e.message);}
  ok('a non-zip is refused', threw.length>0);
  const notBook=await W.makeZip([{name:'hello.txt',text:'hi'}]).then(b=>b.arrayBuffer());
  let threw2='';
  try{await W.readXlsx(notBook);}catch(e){threw2=String(e.message);}
  ok('a zip without a workbook is refused', threw2.length>0);
  W.S.invoices=[];W.S.customers=[];W.S.settings.series='SF';W.S.settings.next=1;

  grp('spreadsheet-shaped CSV');
  /* the same register logic reached through the CSV path */
  const reg='Nr;Data;Pirkejas;Suma be PVM;PVM %\n'+
            'A-1;2026-04-01;UAB Testas;100;21\n';
  const r1=W.parseImportDoc(reg,'r.csv').invoices;
  near('rate column is read, not assumed', W.calc(r1[0]).total, 121);
  const reg9='Nr;Data;Pirkejas;Suma be PVM;PVM %\n'+
             'A-2;2026-04-01;UAB Testas;100;9\n';
  near('a 9% rate survives', W.calc(W.parseImportDoc(reg9,'r.csv').invoices[0]).total, 109);
  /* gross only: used to be refused outright */
  const gross='Nr;Data;Pirkejas;Viso su PVM\nA-3;2026-04-01;UAB Testas;121\n';
  const g=W.parseImportDoc(gross,'g.csv').invoices;
  eq('a gross-only register imports', g.length, 1);
  near('and the gross is preserved exactly', W.calc(g[0]).total, 121);
  near('with the net derived from it', W.calc(g[0]).net, 100);
  /* a "PVM" column holding a rate rather than an amount is caught by the sums */
  const rateCol='Nr;Data;Pirkejas;Suma be PVM;PVM;Viso su PVM\nA-4;2026-04-01;UAB T;100;21;121\n';
  near('a rate hiding in a PVM column still totals right',
       W.calc(W.parseImportDoc(rateCol,'x.csv').invoices[0]).total, 121);
  const sumCol='Nr;Data;Pirkejas;Suma be PVM;PVM;Viso su PVM\nA-5;2026-04-01;UAB T;100;21;121\n';
  eq('one line, not two, when nothing drifts',
     W.parseImportDoc(sumCol,'x.csv').invoices[0].lines.length, 1);
  /* dates in the shapes a spreadsheet emits */
  eq('ISO date kept', W.toIso('2026-01-15'), '2026-01-15');
  eq('dotted date', W.toIso('2026.01.15'), '2026-01-15');
  eq('day-first date', W.toIso('15/01/2026'), '2026-01-15');
  eq('an Excel serial', W.toIso('46023'), '2026-01-01');
  eq('nonsense is left alone', W.toIso('rytoj'), 'rytoj');
  W.S.invoices=[];W.S.customers=[];
}

async function zipTests(W){
  W.S.invoices=[{id:'i1',no:'SF-2026-0001',date:'2026-01-05',dueDate:'2026-01-19',
    buyer:{name:'UAB Pirkėjas',code:'123456789',vat:'LT123456715',address:'Vilnius'},
    lines:[{id:'a',name:'Paslauga',qty:2,unit:'val',price:50,disc:0,vat:21}],
    payments:[],status:'sent',currency:'EUR'}];
  W.S.customers=[{id:'c1',name:'UAB Pirkėjas',code:'123456789',vat:'LT123456715',address:'Vilnius'}];
  W.S.items=[{id:'it1',name:'Paslauga',unit:'val',price:50,vat:21,used:1}];

  let captured=null;
  const realCreate=W.URL.createObjectURL;
  W.URL.createObjectURL=b=>{captured=b;return 'blob:stub';};
  const files=await W.exportEverything();
  W.URL.createObjectURL=realCreate;

  ok('a blob was produced', !!captured);
  ok('blob is a zip', captured && captured.type==='application/zip');
  ok('blob is not empty', captured && captured.size>300);
  const names=files.map(f=>f.name);
  ok('has the JSON backup', names.some(n=>/duomenys\.json$/.test(n)));
  ok('has the invoice register', names.some(n=>/saskaitos\.csv$/.test(n)));
  ok('has the line-level CSV', names.some(n=>/eilutes\.csv$/.test(n)));
  ok('has customers + items CSVs',
     names.some(n=>/pirkejai\.csv$/.test(n)) && names.some(n=>/prekes\.csv$/.test(n)));
  ok('has one HTML per invoice', names.filter(n=>/^.*saskaitos\/.*\.html$/.test(n)).length===1);
  ok('has one XML per invoice', names.filter(n=>/\.xml$/.test(n)).length===1);
  ok('has a readme', names.some(n=>/SKAITYK\.txt$/.test(n)));
  ok('no waybill files when there are none', !names.some(n=>/vaztarasciai/.test(n)));
  ok('everything sits under one dated folder', names.every(n=>/^saskaitos-\d{4}-\d{2}-\d{2}\//.test(n)));

  const lineCsv=files.find(f=>/eilutes\.csv$/.test(f.name)).text;
  eq('line CSV has a header and one row', lineCsv.trim().split('\r\n').length, 2);
  ok('line CSV carries the invoice number', lineCsv.indexOf('SF-2026-0001')>=0);
  const html=files.find(f=>/\.html$/.test(f.name)).text;
  ok('archived HTML is a full document', /^<!DOCTYPE html>/.test(html));
  ok('archived HTML does not auto-print', html.indexOf('window.print()')<0);

  /* read the central directory back out of the real blob */
  const buf=new Uint8Array(await captured.arrayBuffer());
  const dv=new DataView(buf.buffer);
  let eocd=-1;
  for(let i=buf.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  ok('zip has an end-of-central-directory record', eocd>=0);
  eq('directory counts every file', dv.getUint16(eocd+10,true), files.length);
  let off=dv.getUint32(eocd+16,true), seen=0, deflated=0;
  const dec=new TextDecoder();
  for(let i=0;i<files.length;i++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const nlen=dv.getUint16(off+28,true);
    const method=dv.getUint16(off+10,true);
    if(method===8)deflated++;
    const name=dec.decode(buf.subarray(off+46,off+46+nlen));
    if(names.indexOf(name)>=0)seen++;
    off+=46+nlen+dv.getUint16(off+30,true)+dv.getUint16(off+32,true);
  }
  eq('every central entry name matches', seen, files.length);

  /* the archive must pick up waybills too */
  W.S.waybills=[{id:'w1',no:'VZ-1',date:'2026-01-06',seq:1,
    consignor:{name:'A'},carrier:{name:'A'},consignee:{name:'B',code:'1'},
    loadAddr:'X',unloadAddr:'Y',unloadDate:'2026-01-07',vehicle:'AAA 111',driver:'D',
    lines:[{id:'l',name:'Dėžė',code:'',unit:'vnt',qty:1,packs:2,weight:10,value:5}],
    status:'issued',notes:''}];
  let blob2=null;
  const rc2=W.URL.createObjectURL;
  W.URL.createObjectURL=b=>{blob2=b;return 'blob:stub';};
  const files2=await W.exportEverything();
  W.URL.createObjectURL=rc2;
  const n2=files2.map(f=>f.name);
  ok('archive has the waybill register', n2.some(n=>/vaztarasciai\.csv$/.test(n)));
  ok('archive has one HTML per waybill', n2.filter(n=>/vaztarasciai\/.*\.html$/.test(n)).length===1);
  const wbCsv=files2.find(f=>/vaztarasciai\.csv$/.test(f.name)).text;
  ok('waybill CSV names the vehicle', wbCsv.indexOf('AAA 111')>=0);
  eq('waybill CSV has a header and one row', wbCsv.trim().split('\r\n').length, 2);
  W.S.waybills=[];
  ok('entries were actually deflated', deflated>0);
  /* the local header of the first entry must agree with its CRC */
  eq('first local header signature', dv.getUint32(0,true), 0x04034b50);
  W.S.invoices=[];W.S.customers=[];W.S.items=[];W.S.waybills=[];
}
